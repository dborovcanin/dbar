# dbar - full configuration surface.
#
# Every key dbar understands appears here at least once, so this file doubles as a
# reference and as the test config:
#
#   cargo run -- -c config.example.toml

# ---------------------------------------------------------------------------
# Bar surface
# ---------------------------------------------------------------------------

[bar]
height = 36
position = "top"        # "top" | "bottom"
margin = 8              # gap between the bar and the screen edge; floats the bar
gap = 12                # horizontal space between groups
font = "Liberation Sans 10"
exclusive = true        # reserve the space so windows do not sit under the bar

[bar.background]
# The whole-surface background, drawn under every group. Transparent here so the
# groups below read as separate floating islands.
color = "#00000000"     # the last two hex digits are alpha
radius = 0

# ---------------------------------------------------------------------------
# Status provider - anything that speaks the i3bar protocol
# ---------------------------------------------------------------------------

[status]
command = "i3status-rs"
# i3status-rs resolves a bare filename against $XDG_CONFIG_HOME/i3status-rust and
# ignores the working directory, so pass an absolute path or leave this empty and
# install the config first:
#
#   cp examples/i3status-rs.toml ~/.config/i3status-rust/config.toml
args = []

# ---------------------------------------------------------------------------
# Named colors, referenced elsewhere as "$name"
# ---------------------------------------------------------------------------

[colors]
background = "#1e1e2e"
surface = "#313244cc"   # alpha cc, so SwayFX blur shows through
overlay = "#45475aff"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#89b4fa"
warning = "#f9e2af"
critical = "#f38ba8"

# ---------------------------------------------------------------------------
# Positions - each holds an ordered list of groups
# ---------------------------------------------------------------------------

[left]
groups = ["desktop"]

[center]
groups = ["now"]

[right]
groups = ["system"]

# ---------------------------------------------------------------------------
# Reusable styles
#
# Resolution order is: built-in defaults, then the named style a module picks,
# then that module's own inline keys.
# ---------------------------------------------------------------------------

[style.default]
foreground = "$text"
padding = 10

[style.muted]
background = "$overlay"
foreground = "$subtext"
padding = 10

[style.accent]
background = "$accent"
foreground = "$background"
padding = 10

[style.warning]
background = "$warning"
foreground = "$background"
padding = 10

[style.critical]
background = "$critical"
foreground = "$background"
padding = 10

[style.pill]
background = "$overlay"
foreground = "$text"
padding = 12
radius = 12
min_width = 90

# ---------------------------------------------------------------------------
# Groups
#
# "modules" either lists block names explicitly, or contains "*" to take every
# block the provider emits in the order it sends them.
#
# Note: i3status-rs names its blocks by position ("0", "1", ...), so an explicit
# list addresses them by index. A wildcard group avoids that coupling, but every
# block then shares one style, so Powerline transitions need explicit lists.
# ---------------------------------------------------------------------------

[group.desktop]
modules = ["0", "1"]
background = "$surface"
radius = 12
padding = 0
spacing = 0             # only used when the group has no separator

# A separator is a transition between two neighbouring modules, drawn as vector
# geometry rather than as a font glyph.
[group.desktop.separator]
# none | line | slant | chevron | notch | round | curve
shape = "slant"
width = 12              # horizontal space the transition occupies
direction = "right"     # "right" | "left"; mirrors the shape
# previous | next | foreground | background, or a literal color / "$name"
color = "previous"
overlap = 1             # bleed past each side, hiding antialiasing seams

# Outer corners are a separate concept from the separators between modules.
[group.desktop.edges]
left = "round"          # "round" | "none"
right = "none"
radius = 12             # defaults to the group's own radius

[group.now]
# A single module has no interior gap, so no separator is drawn.
modules = ["2"]
background = "$surface"
radius = 18
padding = 6
spacing = 0

# Note: module styles are keyed by block name, so a block listed in two groups
# shares one style. "2" is left out here because its pill radius would break the
# chain of chevrons.
[group.system]
modules = ["0", "1", "3"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

# Right-hand groups conventionally point the other way.
[group.system.separator]
shape = "chevron"
width = 12
direction = "left"
color = "previous"
overlap = 1

[group.system.edges]
left = "round"
right = "round"
radius = 12

# ---------------------------------------------------------------------------
# Modules
#
# "style" names a [style.*] table; any other key overrides it for this module.
# Alternating backgrounds are what make a Powerline transition visible.
# ---------------------------------------------------------------------------

[module.0]
style = "accent"

[module.1]
style = "muted"

# Inline overrides on top of a named style.
[module.2]
style = "pill"
foreground = "$accent"
min_width = 120

# A module with no named style falls back to the built-in defaults.
[module.3]
background = "#585b70ff"
foreground = "$text"
padding = 10
radius = 0
min_width = 0
