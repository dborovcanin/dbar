name: Release

# A v* tag is the whole trigger: pushing one builds the binary and publishes the
# release. Nothing is built on a maintainer's machine, and nothing has to be
# dispatched by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      # Everything the build links against: xkbcommon for the toolkit's keyboard
      # handling, wayland for the client, pipewire for the volume. libspa
      # generates its bindings with clang.
      - name: Install the Arch Linux build environment
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            clang \
            pkgconf \
            libxkbcommon \
            wayland \
            libpipewire

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Build the downloadable binary
        run: |
          cargo build --release --locked
          mkdir -p dist
          install -m755 target/release/dbar dist/dbar-linux-x86_64
          cd dist
          sha256sum dbar-linux-x86_64 >dbar-linux-x86_64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dbar-linux-x86_64
          path: dist/dbar-linux-x86_64*

  # Publishing runs outside the container, so the release action gets the
  # runner's own node rather than whatever the Arch image happens to carry.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create the GitHub release and attach the assets
        uses: softprops/action-gh-release@v2
        with:
          files: dbar-linux-x86_64*
          generate_release_notes: true
