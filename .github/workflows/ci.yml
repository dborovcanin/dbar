name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A failed build should say so, not fill the log with a backtrace of cargo.
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Everything the build probes for with pkg-config: xkbcommon for the
      # toolkit's keyboard handling, wayland for the client, pipewire for the
      # volume. libspa generates its bindings with clang.
      - name: Install the libraries the build links
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suite parses every shipped example, so a config change that breaks
      # one fails here rather than on somebody's bar.
      - name: Tests
        run: cargo test --release

  # The version in Cargo.toml is a promise, and stable alone never tests it: a
  # dependency that raises its own floor breaks the oldest supported toolchain
  # while every green build says otherwise.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries the build links
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libpipewire-0.3-dev

      - name: Read the minimum version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Building is the whole test: what breaks on an old toolchain breaks at
      # compile time, and the locked versions are what a user gets.
      - name: Build against the minimum
        run: cargo build --locked --all-targets
