# dbar - the full configuration surface.
#
# A reference rather than a starting point: every key dbar understands appears
# here at least once. A realistic bar, mixing the two kinds of module dbar has -
# the ones it reads itself, and the ones an external i3bar-protocol provider
# sends - across six groups and all three positions, each group using a
# different separator shape.
#
# To run it, point [i3bar] args at a real i3status-rs configuration first; the
# path below is a placeholder, and tildes are not expanded. The other examples
# need nothing installed:
#
#   config.toml       the compiled-in default, read entirely by dbar
#   daily.toml        an everyday bar, every module read by dbar itself
#   separators.toml   all seven separator shapes, side by side
#   powerline.toml    an edge-to-edge ribbon with pointed transitions
#   islands.toml      translucent rounded panels floating over the wallpaper
#   minimal.toml      text and hairlines, along the bottom of the screen
#   states.toml       modules that restyle themselves as values move

[bar]
height = 34
position = "top"
# Where the bar sits in the compositor's stack: "top" (default) is above
# ordinary windows, "bottom" lets a floating window be dragged over the bar,
# "overlay" covers even a screen locker, and "background" is wallpaper level.
layer = "top"
margin = 3
gap = 3
# Kept font-agnostic, since this is the built-in default. Icon sizes follow it
# unless [bar] icon_size says otherwise.
font = "sans-serif 15"
icon_size = 20
exclusive = true       # default: true; reserve the space so windows do not sit under the bar

# ---------------------------------------------------------------------------
# External status provider
#
# Only needed for what dbar cannot yet read itself: here, just the volume. The
# provider is started with `args` and its own configuration file.
#
# The i3bar protocol gives blocks no names worth selecting on - i3status-rs
# numbers them - so `names` says what they are, in the order the provider emits
# them. Get the order wrong and a module follows the wrong block, so the names
# are held back until the counts agree.
# ---------------------------------------------------------------------------

[i3bar]
command = "i3status-rs"
args = ["/path/to/i3status-rust/config.toml"]
names = ["volume"]

# ---------------------------------------------------------------------------
# Named colors, referenced elsewhere as "$name"
# ---------------------------------------------------------------------------

[colors]
background = "#1e1e2e"
surface = "#313244cc"  # alpha cc, so SwayFX blur shows through
slate = "#585b70ff"
overlay = "#45475aff"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#89b4fa"
teal = "#94e2d5"
warning = "#f9e2af"
critical = "#f38ba8"

# ---------------------------------------------------------------------------
# Positions
#
# Each position holds an ordered list of groups, so one position can carry
# several islands.
# ---------------------------------------------------------------------------

[left]
groups = ["desktop", "window"]

[center]
groups = ["time"]

[right]
groups = ["system", "media", "power"]

# ---------------------------------------------------------------------------
# Reusable styles
#
# Resolution order: built-in defaults, then the named style a module picks, then
# that module's own inline keys.
# ---------------------------------------------------------------------------

[style.default]
foreground = "$text"
padding = 4
background = "#00000000" # default: transparent
radius = 0               # default: 0
min_width = 0            # default: 0
icon = "none"            # default: none
icon_size = 20           # default: 1.4x the font size
icon_gap = 5             # default: a quarter of the icon size

# Filled transitions need neighbouring modules to contrast, so these alternate.
[style.cool]
background = "$accent"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.warm]
background = "$warning"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.mint]
background = "$teal"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.stone]
background = "$slate"
foreground = "$text"
padding = 4
radius = 0            # default: 0
min_width = 0         # default: 0
icon = "none"         # default: none
icon_size = 20        # default: 1.4x the font size

# No background of its own, so the group background shows through continuously.
# Hover is paint-only: background, foreground and radius. Anything affecting
# metrics is ignored, so a module cannot resize under the pointer.
[style.hovered]
background = "$overlay"
foreground = "$text"    # default: #cdd6f4
padding = 4             # default: 8
radius = 0              # default: 0
min_width = 0           # default: 0
icon = "none"           # default: none
icon_size = 20          # default: 1.4x the font size

[style.plain]
foreground = "$text"
padding = 4
background = "#00000000" # default: transparent
radius = 0               # default: 0
min_width = 0            # default: 0
icon = "none"            # default: none
icon_size = 20           # default: 1.4x the font size

[style.warning]
background = "$warning"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.critical]
background = "$critical"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

# ---------------------------------------------------------------------------
# Groups
#
# A separator is a transition between two neighbouring modules, drawn as vector
# geometry rather than as a font glyph:
#
#   shape      none | line | slant | chevron | notch | round | curve
#   width      horizontal space the transition occupies
#   direction  "right" | "left"; mirrors the shape
#   color      previous | next | foreground | background, or a color / "$name"
#   overlap    bleed past each side, hiding antialiasing seams
#
# With shape = "none" the group falls back to its own `spacing` for the gap.
# Change any `shape` below to see the others; the geometry is the same for all.
#
# Outer corners are a separate concept from the separators between modules:
#
#   left/right "round" | "none"
#   radius     defaults to the group's own radius
# ---------------------------------------------------------------------------

# Workspaces and the focused window come from the compositor rather than the
# status provider, so their modules say where they are from. A workspace module
# expands into one rectangle per workspace, each clickable.
[group.desktop]
modules = ["workspaces"]
background = "$surface"
radius = 12
padding = 3
spacing = 3

# A workspace module expands into several, so a group separator lands between
# them like it would between any other pair.
#[group.desktop.separator]
#shape = "line"
#width = 9
#direction = "right"
#color = "$subtext"
#overlap = 0

[group.desktop.edges]
left = "round"
right = "round"
radius = 12

[group.window]
modules = ["title"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.window.separator]
shape = "none"
width = 10
direction = "right"
color = "previous"
overlap = 0

[group.window.edges]
left = "round"
right = "round"
radius = 12

[group.time]
modules = ["clock"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

# CPU, memory and disk, joined by slanted transitions.

[group.time.separator]
shape = "none"
width = 10
direction = "right"
color = "previous"
overlap = 0

[group.time.edges]
left = "round"
right = "round"
radius = 12

[group.system]
modules = ["cpu", "memory", "load", "temperature", "disk"]
background = "$surface"
radius = 12
padding = 0
spacing = 0                         # only used when the group has no separator

[group.system.separator]
shape = "slant"
width = 11
direction = "right"
color = "previous"
overlap = 1

[group.system.edges]
left = "round"
right = "none" # a squared trailing edge
radius = 12

# Wireless, volume and brightness share one surface, divided by hairlines. A
# hairline divides rather than transitioning between two regions, so it takes
# the separator colour itself and suits modules with no background of their own.
[group.media]
modules = ["media", "wifi", "volume", "brightness"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.media.separator]
shape = "line"
width = 11
direction = "right"
color = "$subtext"
overlap = 0

# Right-hand groups conventionally point the other way.

[group.media.edges]
left = "round"
right = "round"
radius = 12

[group.power]
modules = ["battery"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.power.separator]
shape = "chevron"
width = 11
direction = "left"
color = "previous"
overlap = 1

# ---------------------------------------------------------------------------
# Modules
#
# Every key a [style.*] takes is also valid directly on a module, plus:
#
#   style      name of a [style.*] to start from        default: built-in defaults
#   source     "provider" | "sway:window" |
#              "sway:workspaces"                        default: "provider"
#
# and on a [module.*.states.*]:
#
#   style      a [style.*] whose keys are applied over the module's
#   below      matches under this percentage
#   above      matches over this percentage
#   contains   matches this substring of the module's text
#   strip      remove that substring once matched        default: false
#   urgent     matches the provider's urgent flag        default: false
#   hover      matches while the pointer is over it      default: false
#   focused    matches the focused workspace             default: false
#   visible    matches a workspace shown on an output    default: false
#
# Unlike the sections above, these are deliberately left out where they are not
# doing work. Writing a default onto a module is not a no-op: the cascade runs
# built-in defaults, then the named style, then the module's own keys, so
# spelling out `padding = 8` here would override the padding its style sets.
#
# "style" names a [style.*] table; any other key overrides it for this module.
# Module styles are keyed by block name, so a block placed in two groups would
# share one style; here each block appears once.
# ---------------------------------------------------------------------------

# From the compositor. Clicking a workspace switches to it.

[group.power.edges]
left = "round"
right = "round"
radius = 12

# `ends` is the transition where the group meets the bar, drawn with the same
# shapes as `separator` but between a module and nothing. It is what gives a
# Powerline ribbon its point; see examples/powerline.toml. The ends face the
# way the group's separators do, and take their width and overlap from the
# separator unless told otherwise.
[group.power.ends]
left = "none"
right = "none"
width = 10
overlap = 1

[module.workspaces]
source = "sway:workspaces"
style = "plain"
padding = 9

[module.workspaces.states.focused]
focused = true
style = "cool"

[module.workspaces.states.urgent]
urgent = true
style = "warning"

# A window title has no length limit of its own, so it is capped here rather
# than allowed to push the clock aside. What does not fit is cut with an
# ellipsis.
[module.title]
source = "sway:window"
style = "plain"
max_width = 320

# `source` says where a module's content comes from, and `format` is what it
# says, written against the fields that source publishes:
#
#   cpu               $utilization
#   memory            $percent $used $total $available $swap_*
#   battery           $percent $status $supply $power $time $health $threshold
#   backlight         $brightness $device
#   audio             $volume $muted $device
#   media             $title $artist $album $status $player
#   time              $now
#   provider          $text $percent
#   sway:window       $title
#   sway:workspaces   $name
#
# The first four are read by dbar itself and take an `interval`, which needs a
# unit. The rest arrive from elsewhere, and how often is not dbar's business.
# Every source has a default format, so a module wanting the ordinary thing
# says only where it comes from.
#
# A field can be formatted: $percent.n(w:4) pads to a fixed width so the module
# stops resizing as the number changes, and $title.str(max:40) caps its length
# in characters. Text in {braces} disappears whole when a field inside it has
# nothing to report, and $a|$b|'fallback' says the best thing it can. Write a
# literal $ or { as $$ or {{. The whole format is itself a group, so a module
# with nothing to report draws nothing rather than an empty box.
[module.clock]
source = "time"
# Read on the minute rather than drifting from whenever dbar started.
interval = "1m"
format = " $now.time(f:'%a %d %b %H:%M') "
style = "cool"
icon = "clock"

[module.cpu]
source = "cpu"
interval = "2s"
format = " $utilization.n(w:4) "
style = "cool"
icon = "cpu"

# `state` matches how the source rates itself rather than any number it sends.
# A collector that cannot read says so, and this is how that looks.
[module.cpu.states.unreadable]
state = "error"
style = "critical"

# `format_alt` is what a left click moves on to, and back round to the start.
# One further wording is written as a string; several as a list, which is how a
# module carries three views rather than two.
[module.memory]
source = "memory"
interval = "5s"
format = " $percent.n(w:4) "
format_alt = " $used.n(d:1) of $total.n(d:0){  swap $swap_percent} "
style = "warm"
icon = "memory"

# Thresholds read the value the source nominated as its main one. `field` names
# a different one, which has to be a number the source actually publishes.
[module.memory.states.swapping]
field = "swap_percent"
above = 20
style = "warning"

# `signal` reads the source again on demand, counted from SIGRTMIN because
# where the realtime range starts is up to the C library. A key bound to
# `something; pkill -RTMIN+8 dbar` then shows the new value straight away
# rather than when the interval next comes round.
#
# The backlight rarely needs it: the kernel reports a brightness change, so the
# module is read when it moves and never in between, whatever `interval` says.
# The signal is here for a controller too old to have `actual_brightness`, and
# costs nothing when it is never sent.
[module.brightness]
source = "backlight"
# `scroll` is what one notch of the wheel is worth, and only the sources dbar can
# set as well as read take it: a backlight and the volume. On audio, the middle
# button mutes.
scroll = "5%"
signal = 8
format = " $brightness.n(w:4) "
style = "plain"
icon = "brightness"

# `controls = true` makes a module the remote as well as the display: on a media
# module a left click plays and pauses, and the wheel moves between tracks. It is
# the counterpart of `scroll` for something operated by buttons rather than by a
# step, and setting both is an error.
#
# Which player is chosen is not a setting: the one that is playing wins, and a
# paused one only speaks when nothing else does.
# `collapsible = true` folds a module down to its icon on a right click, and back
# on the next one. A collapsible module has to have an icon, or there would be
# nothing left to see or click, and that is a startup error rather than a bar
# with a hole in it.
[module.media]
source = "media"
controls = true
collapsible = true
format = " {$artist  }$title "
format_alt = [" $album ", " $player "]
style = "plain"
max_width = 280
# A button says what pressing it does, so a playing track wears the pause icon.
icon = "pause"

[module.media.states.paused]
field = "status"
equals = "paused"
foreground = "$subtext"
icon = "play"

# A disk module is pointed at a filesystem; without `path` it is the root. The
# percentage leaves out the reserve only root may write into, so a disk with no
# room left for an ordinary program reads as full rather than as 95%.
[module.disk]
source = "disk"
path = "/"
interval = "1m"
format = " $available "
format_alt = " $percent.n(w:4) of $total.n(d:0) "
style = "mint"
icon = "disk"

[module.disk.states.filling]
above = 90
style = "warning"

# Without `interface` this follows whichever one is actually up, so unplugging
# the cable moves it to the wireless card. Container and bridge interfaces are
# never picked: a machine running Docker has dozens, and none of them is what a
# person means by "the network".
[module.wifi]
source = "network"
interval = "2s"
format = " $down{  $up} "
format_alt = [" $device $state ", " $signal.n(w:4)  $dbm.n(d:0) dBm "]
style = "plain"
icon = "wifi"

[module.wifi.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

# Load is a count of runnable processes, not a percentage, so what "busy" means
# depends on the machine: 4.0 saturates a quad-core and idles a sixteen. The
# raw figure is what a load module shows; `percent` is the same thing against
# the core count, which is what a threshold should key on.
[module.load]
source = "load"
interval = "5s"
format = " $one.n(d:2) "
style = "plain"

[module.load.states.busy]
field = "percent"
above = 80
style = "warning"

# Without `chip` this finds the processor's own sensor by driver name, since
# every other reading on the machine is also a real temperature and none of
# them is the answer. The sensors firmware lists for hardware that is not
# fitted read zero, and are left out.
[module.temperature]
source = "temperature"
interval = "5s"
format = " $temp.n(d:0) "
format_alt = " $temp.n(d:0) $label ($chip) "
style = "plain"
# Graded like the battery and the wifi: five steps, read here from the degrees
# themselves, since a processor lives inside the first hundred of them.
icon = "temperature"

[module.temperature.states.warm]
state = "warning"
style = "warning"

[module.temperature.states.hot]
state = "critical"
style = "critical"

[module.volume]
style = "plain"
icon = "volume"

# One module covers all three states: the provider spells each into the text and
# a rule reads it there. "strip" drops the wording once matched, so what is left
# is the icon saying it. Stripping "MUTED" empties the text, and a module with an
# icon still draws, so a muted volume is the icon alone.
#
# Matching on text is only allowed for provider modules, because text is all the
# protocol carries. A native source publishes values, so its rules key on those.
[module.volume.states.muted]
contains = "MUTED"
strip = true
icon = "volume-muted"

[module.volume.states.headphones]
contains = "HEAD"
strip = true
icon = "headphones"

# Braces hold what should disappear rather than draw half a sentence. A machine
# on mains has no time to report, one allowed to charge to full has no cap, and
# neither is mentioned; a laptop under TLP says "80% not charging  cap 80%".
[module.battery]
source = "battery"
interval = "30s"
format = " $percent.n(w:4){  $time.dur(style:short) left}{  cap $threshold} "
format_alt = " $percent.n(w:4)  $status{  $power.n(d:1)}  health $health.n(d:0) "
style = "stone"
icon = "battery"

# `equals` compares a field the source published, where `contains` searches the
# text a format produced. Both say "match on a word", but only this one is
# reading what was measured, so it is the one a native module uses.
[module.battery.states.charging]
field = "status"
equals = "charging"
icon = "battery-charging"

# A battery rates its own situation, and only alarms while it is actually
# draining: the same 10% with the charger in is fine. Keying on that rather
# than on a number here means the thresholds live in one place.
#
# A state overlays the module's own style rather than replacing it, so the icon
# above survives and keeps grading.
[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"
