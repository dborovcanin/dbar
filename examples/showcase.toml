# dbar - the full configuration surface.
#
#   dbar -c examples/showcase.toml
#
# A realistic bar: every block the provider sends appears exactly once, spread
# across four groups and all three positions, each group using a different
# separator shape.
#
# Blocks are named by # ---------------------------------------------------------------------------
# Status provider
#
# Declaring blocks here is "generated mode": dbar writes the provider's own
# configuration into $XDG_RUNTIME_DIR/dbar/provider.toml and starts it against
# that, so there is one file to maintain instead of two.
#
# Every key except `name` is passed through to the provider untouched, so dbar
# does not model its schema and does not drift as that schema changes. `name` is
# dbar's own handle, which the groups and modules below refer to.
#
# To drive an external provider instead, drop the [[status.block]] entries and
# use `args` with `blocks` to name what it emits by position:
#
#   [status]
#   command = "i3status-rs"
#   args = ["/path/to/its/config.toml"]
#   blocks = ["cpu", "memory", ...]
# ---------------------------------------------------------------------------

[bar]
height = 34
position = "top"
margin = 3
gap = 3
# Kept font-agnostic, since this is the built-in default. Icon sizes follow it
# unless [bar] icon_size says otherwise.
font = "sans-serif 15"
icon_size = 20
exclusive = true       # default: true; reserve the space so windows do not sit under the bar

[status]
command = "i3status-rs"

# "native" leaves colors and separators to dbar rather than baking them into the
# protocol output. "none" is not "no icon": it substitutes short text labels, so
# "$icon" reads CPU, MEM, DISK. Set icons = "material-nf" for glyphs, and pair it
# with a font that carries them.
[status.theme]
theme = "native"

[status.icons]
icons = "none"

# dbar draws its own icons, so the provider's text labels are turned off. What
# is left are markers for the states a module cannot otherwise detect: the sound
# block signals headphones and mute only through its icon, so those keep a word
# for a state rule to match on, and `strip` removes it once matched.
[status.icons.overrides]
volume = ""
volume_muted = "MUTED"
headphones = "HEAD "
bat = ""
bat_charging = ""

[[status.block]]
name = "cpu"
block = "cpu"
format = " $utilization "

# format_alt toggles on click, and dbar forwards clicks, so this expands to
# used/total when clicked and collapses again.
[[status.block]]
name = "memory"
block = "memory"
format = " $mem_used_percents "
format_alt = " $mem_used/$mem_total "

[[status.block]]
name = "disk"
block = "disk_space"
path = "/"
format = " $free "

# Signal strength, so the graded wifi icon has a percentage to read.
[[status.block]]
name = "wifi"
block = "net"
format = " $signal_strength "

[[status.block]]
name = "volume"
block = "sound"
format = " $icon$volume|$icon "

[[status.block]]
name = "brightness"
block = "backlight"
format = " $brightness "

# Each state gets its own wording, so the module can tell them apart without
# depending on which icon set is in use.
[[status.block]]
name = "battery"
block = "battery"
format = " $percentage "
charging_format = " CHARGING $percentage "
full_format = " $percentage "

[[status.block]]
name = "clock"
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d %b %H:%M') "

# ---------------------------------------------------------------------------
# Named colors, referenced elsewhere as "$name"
# ---------------------------------------------------------------------------

[colors]
background = "#1e1e2e"
surface = "#313244cc"  # alpha cc, so SwayFX blur shows through
slate = "#585b70ff"
overlay = "#45475aff"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#89b4fa"
teal = "#94e2d5"
warning = "#f9e2af"
critical = "#f38ba8"

# ---------------------------------------------------------------------------
# Positions
#
# Each position holds an ordered list of groups, so one position can carry
# several islands.
# ---------------------------------------------------------------------------

[left]
groups = ["desktop", "window"]

[center]
groups = ["time"]

[right]
groups = ["system", "media", "power"]

# ---------------------------------------------------------------------------
# Reusable styles
#
# Resolution order: built-in defaults, then the named style a module picks, then
# that module's own inline keys.
# ---------------------------------------------------------------------------

[style.default]
foreground = "$text"
padding = 4
background = "#00000000" # default: transparent
radius = 0               # default: 0
min_width = 0            # default: 0
icon = "none"            # default: none
icon_size = 20           # default: 1.4x the font size

# Filled transitions need neighbouring modules to contrast, so these alternate.
[style.cool]
background = "$accent"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.warm]
background = "$warning"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.mint]
background = "$teal"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.stone]
background = "$slate"
foreground = "$text"
padding = 4
radius = 0            # default: 0
min_width = 0         # default: 0
icon = "none"         # default: none
icon_size = 20        # default: 1.4x the font size

# No background of its own, so the group background shows through continuously.
# Hover is paint-only: background, foreground and radius. Anything affecting
# metrics is ignored, so a module cannot resize under the pointer.
[style.hovered]
background = "$overlay"
foreground = "$text"    # default: #cdd6f4
padding = 4             # default: 8
radius = 0              # default: 0
min_width = 0           # default: 0
icon = "none"           # default: none
icon_size = 20          # default: 1.4x the font size

[style.plain]
foreground = "$text"
padding = 4
background = "#00000000" # default: transparent
radius = 0               # default: 0
min_width = 0            # default: 0
icon = "none"            # default: none
icon_size = 20           # default: 1.4x the font size

[style.warning]
background = "$warning"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

[style.critical]
background = "$critical"
foreground = "$background"
padding = 4
radius = 0                 # default: 0
min_width = 0              # default: 0
icon = "none"              # default: none
icon_size = 20             # default: 1.4x the font size

# ---------------------------------------------------------------------------
# Groups
#
# A separator is a transition between two neighbouring modules, drawn as vector
# geometry rather than as a font glyph:
#
#   shape      none | line | slant | chevron | notch | round | curve
#   width      horizontal space the transition occupies
#   direction  "right" | "left"; mirrors the shape
#   color      previous | next | foreground | background, or a color / "$name"
#   overlap    bleed past each side, hiding antialiasing seams
#
# With shape = "none" the group falls back to its own `spacing` for the gap.
# Change any `shape` below to see the others; the geometry is the same for all.
#
# Outer corners are a separate concept from the separators between modules:
#
#   left/right "round" | "none"
#   radius     defaults to the group's own radius
# ---------------------------------------------------------------------------

# Workspaces and the focused window come from the compositor rather than the
# status provider, so their modules say where they are from. A workspace module
# expands into one rectangle per workspace, each clickable.
[group.desktop]
modules = ["workspaces"]
background = "$surface"
radius = 12
padding = 3
spacing = 3

# A workspace module expands into several, so a group separator lands between
# them like it would between any other pair.
#[group.desktop.separator]
#shape = "line"
#width = 9
#direction = "right"
#color = "$subtext"
#overlap = 0

[group.desktop.edges]
left = "round"
right = "round"
radius = 12

[group.window]
modules = ["title"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.window.separator]
shape = "none"
width = 10
direction = "right"
color = "previous"
overlap = 0

[group.window.edges]
left = "round"
right = "round"
radius = 12

[group.time]
modules = ["clock"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

# CPU, memory and disk, joined by slanted transitions.

[group.time.separator]
shape = "none"
width = 10
direction = "right"
color = "previous"
overlap = 0

[group.time.edges]
left = "round"
right = "round"
radius = 12

[group.system]
modules = ["cpu", "memory", "disk"]
background = "$surface"
radius = 12
padding = 0
spacing = 0                         # only used when the group has no separator

[group.system.separator]
shape = "slant"
width = 11
direction = "right"
color = "previous"
overlap = 1

[group.system.edges]
left = "round"
right = "none" # a squared trailing edge
radius = 12

# Wireless, volume and brightness share one surface, divided by hairlines. A
# hairline divides rather than transitioning between two regions, so it takes
# the separator colour itself and suits modules with no background of their own.
[group.media]
modules = ["wifi", "volume", "brightness"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.media.separator]
shape = "line"
width = 11
direction = "right"
color = "$subtext"
overlap = 0

# Right-hand groups conventionally point the other way.

[group.media.edges]
left = "round"
right = "round"
radius = 12

[group.power]
modules = ["battery"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.power.separator]
shape = "chevron"
width = 11
direction = "left"
color = "previous"
overlap = 1

# ---------------------------------------------------------------------------
# Modules
#
# Every key a [style.*] takes is also valid directly on a module, plus:
#
#   style      name of a [style.*] to start from        default: built-in defaults
#   source     "provider" | "sway:window" |
#              "sway:workspaces"                        default: "provider"
#
# and on a [module.*.states.*]:
#
#   style      a [style.*] whose keys are applied over the module's
#   below      matches under this percentage
#   above      matches over this percentage
#   contains   matches this substring of the module's text
#   strip      remove that substring once matched        default: false
#   urgent     matches the provider's urgent flag        default: false
#   hover      matches while the pointer is over it      default: false
#   focused    matches the focused workspace             default: false
#   visible    matches a workspace shown on an output    default: false
#
# Unlike the sections above, these are deliberately left out where they are not
# doing work. Writing a default onto a module is not a no-op: the cascade runs
# built-in defaults, then the named style, then the module's own keys, so
# spelling out `padding = 8` here would override the padding its style sets.
#
# "style" names a [style.*] table; any other key overrides it for this module.
# Module styles are keyed by block name, so a block placed in two groups would
# share one style; here each block appears once.
# ---------------------------------------------------------------------------

# From the compositor. Clicking a workspace switches to it.

[group.power.edges]
left = "round"
right = "round"
radius = 12

[module.workspaces]
source = "sway:workspaces"
style = "plain"
padding = 9

[module.workspaces.states.focused]
focused = true
style = "cool"

[module.workspaces.states.urgent]
urgent = true
style = "warning"

# A window title has no length limit of its own, so it is capped here rather
# than allowed to push the clock aside. What does not fit is cut with an
# ellipsis.
[module.title]
source = "sway:window"
style = "plain"
max_width = 320

[module.clock]
style = "cool"
icon = "clock"

[module.cpu]
style = "cool"
icon = "cpu"

[module.memory]
style = "warm"
icon = "memory"

# `format` is what a module says, written against the fields its source
# publishes. Every source has a default, so most modules never need one:
#
#   provider          $text, $percent
#   sway:window       $title
#   sway:workspaces   $name
#
# A field can be formatted: $percent.n(w:3) pads to a fixed width so the module
# stops resizing as the number changes, and $title.str(max:40) caps its length
# in characters. Text in {braces} disappears whole when a field inside it has
# nothing to report, and $a|$b|'fallback' says the best thing it can. Write a
# literal $ or { as $$ or {{.
#
# The provider sends rendered text, so $text is nearly always what to use here.
# Native sources publish real values, and formats come into their own there.
[module.disk]
style = "mint"
icon = "disk"
format = "$text"

# `format` is what a module says, written against the fields its source
# publishes. Every source has a default, so most modules never need one:
#
#   provider          $text, $percent
#   sway:window       $title
#   sway:workspaces   $name
#
# A field can be formatted: $percent.n(w:3) pads to a fixed width so the module
# stops resizing as the number changes, and $title.str(max:40) caps its length
# in characters. Text in {braces} disappears whole when a field inside it has
# nothing to report, and $a|$b|'fallback' says the best thing it can. Write a
# literal $ or { as $$ or {{.
#
# The provider sends rendered text, so $text is nearly always what to use here.
# Native sources publish real values, and formats come into their own there.
# Graded icons pick one of five steps from a percentage in their own text.
[module.wifi]
style = "plain"
icon = "wifi"

[module.volume]
style = "plain"
icon = "volume"

# One module covers all three states: the provider spells each into the text and
# a rule reads it there. "strip" drops the wording once matched, so what is left
# is the icon saying it. Stripping "MUTED" empties the text, and a module with an
# icon still draws, so a muted volume is the icon alone.
[module.volume.states.muted]
contains = "MUTED"
strip = true
icon = "volume-muted"

[module.volume.states.headphones]
contains = "HEAD"
strip = true
icon = "headphones"

[module.brightness]
style = "plain"
icon = "brightness"

[module.battery]
style = "stone"
icon = "battery"

[module.battery.states.charging]
contains = "CHARGING"
strip = true
icon = "battery-charging"

# A state overlays the module's own style rather than replacing it, so the icon
# above survives and keeps grading. Rules are checked tightest bound first, so
# "below 15" wins over "below 30" at 10%.
[module.battery.states.warning]
below = 30
style = "warning"

[module.battery.states.critical]
below = 15
style = "critical"
