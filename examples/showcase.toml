# dbar - the full configuration surface.
#
#   dbar -c examples/showcase.toml
#
# A realistic bar: every block the provider sends appears exactly once, spread
# across four groups and all three positions, each group using a different
# separator shape.
#
# Blocks are named by # ---------------------------------------------------------------------------
# Status provider
#
# Declaring blocks here is "generated mode": dbar writes the provider's own
# configuration into $XDG_RUNTIME_DIR/dbar/provider.toml and starts it against
# that, so there is one file to maintain instead of two.
#
# Every key except `name` is passed through to the provider untouched, so dbar
# does not model its schema and does not drift as that schema changes. `name` is
# dbar's own handle, which the groups and modules below refer to.
#
# To drive an external provider instead, drop the [[status.block]] entries and
# use `args` with `blocks` to name what it emits by position:
#
#   [status]
#   command = "i3status-rs"
#   args = ["/path/to/its/config.toml"]
#   blocks = ["cpu", "memory", ...]
# ---------------------------------------------------------------------------

[status]
command = "i3status-rs"

# "native" leaves colors and separators to dbar rather than baking them into the
# protocol output. "none" is not "no icon": it substitutes short text labels, so
# "$icon" reads CPU, MEM, DISK. Set icons = "material-nf" for glyphs, and pair it
# with a font that carries them.
[status.theme]
theme = "native"

[status.icons]
icons = "none"

[[status.block]]
name = "cpu"
block = "cpu"
format = " $icon $utilization "

# format_alt toggles on click, and dbar forwards clicks, so this module expands
# to used/total when clicked and collapses again.
[[status.block]]
name = "memory"
block = "memory"
format = " $icon $mem_used_percents "
format_alt = " $icon $mem_used/$mem_total "

[[status.block]]
name = "disk"
block = "disk_space"
path = "/"
format = " $icon $free "

# Signal strength, so dbar's graded wifi icon has a percentage to read.
[[status.block]]
name = "wifi"
block = "net"
format = " $icon $signal_strength "

# Placeholders, so the showcase can demonstrate icons that nothing selects
# automatically yet. A real config would drive these from actual state.
[[status.block]]
name = "ethernet"
block = "custom"
command = "echo LAN"
interval = 3600

[[status.block]]
name = "offline"
block = "custom"
command = "echo offline"
interval = 3600

[[status.block]]
name = "volume"
block = "sound"
format = " $icon $volume "

[[status.block]]
name = "muted"
block = "custom"
command = "echo muted"
interval = 3600

[[status.block]]
name = "headphones"
block = "custom"
command = "echo headphones"
interval = 3600

[[status.block]]
name = "brightness"
block = "backlight"
format = " $icon $brightness "

[[status.block]]
name = "battery"
block = "battery"
format = " $icon $percentage "

# Reports a percentage, because the charging icon grades on it just as the plain
# battery icon does.
[[status.block]]
name = "charging"
block = "custom"
command = "echo 72%"
interval = 3600

[[status.block]]
name = "clock"
block = "time"
interval = 5
format = " $icon $timestamp.datetime(f:'%a %d %b %H:%M') "

# ---------------------------------------------------------------------------
# Named colors, referenced elsewhere as "$name"
# ---------------------------------------------------------------------------

[colors]
background = "#1e1e2e"
surface = "#313244cc"  # alpha cc, so SwayFX blur shows through
slate = "#585b70ff"
overlay = "#45475aff"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#89b4fa"
teal = "#94e2d5"
warning = "#f9e2af"
critical = "#f38ba8"

# ---------------------------------------------------------------------------
# Positions
#
# Each position holds an ordered list of groups, so one position can carry
# several islands.
# ---------------------------------------------------------------------------

[left]
groups = ["system", "network"]

[center]
groups = ["media"]

[right]
groups = ["power", "time"]

# ---------------------------------------------------------------------------
# Reusable styles
#
# Resolution order: built-in defaults, then the named style a module picks, then
# that module's own inline keys.
# ---------------------------------------------------------------------------

[style.default]
foreground = "$text"
padding = 9

# Filled transitions need neighbouring modules to contrast, so these alternate.
[style.cool]
background = "$accent"
foreground = "$background"
padding = 9

[style.warm]
background = "$warning"
foreground = "$background"
padding = 9

[style.mint]
background = "$teal"
foreground = "$background"
padding = 9

[style.stone]
background = "$slate"
foreground = "$text"
padding = 9

# No background of its own, so the group background shows through continuously.
# Hover is paint-only: background, foreground and radius. Anything affecting
# metrics is ignored, so a module cannot resize under the pointer.
[style.hovered]
background = "$overlay"

[style.plain]
foreground = "$text"
padding = 12

[style.warning]
background = "$warning"
foreground = "$background"
padding = 9

[style.critical]
background = "$critical"
foreground = "$background"
padding = 9

# ---------------------------------------------------------------------------
# Groups
#
# A separator is a transition between two neighbouring modules, drawn as vector
# geometry rather than as a font glyph:
#
#   shape      none | line | slant | chevron | notch | round | curve
#   width      horizontal space the transition occupies
#   direction  "right" | "left"; mirrors the shape
#   color      previous | next | foreground | background, or a color / "$name"
#   overlap    bleed past each side, hiding antialiasing seams
#
# With shape = "none" the group falls back to its own `spacing` for the gap.
# Change any `shape` below to see the others; the geometry is the same for all.
#
# Outer corners are a separate concept from the separators between modules:
#
#   left/right "round" | "none"
#   radius     defaults to the group's own radius
# ---------------------------------------------------------------------------

# CPU, memory and disk, joined by slanted transitions.
[group.system]
modules = ["cpu", "memory", "disk"]
background = "$surface"
radius = 12
padding = 0
spacing = 0                         # only used when the group has no separator

[group.system.separator]
shape = "slant"
width = 11
direction = "right"
color = "previous"
overlap = 1

[group.system.edges]
left = "round"
right = "none" # a squared trailing edge
radius = 12

# Connectivity. A hairline divides rather than transitioning between two
# regions, so it takes the separator color itself and is never mirrored. It
# suits modules that share a background: the group reads as one surface with a
# divider in it, which is why these modules carry no background of their own.
[group.network]
modules = ["wifi", "ethernet", "offline"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.network.separator]
shape = "line"
width = 11
direction = "right"
color = "$subtext"
overlap = 0

# Volume, joined by a rounded lobe.
[group.media]
modules = ["volume", "muted", "headphones"]
background = "$surface"
radius = 18
padding = 0
spacing = 0

[group.media.separator]
shape = "round"
width = 13
direction = "right"
color = "previous"
overlap = 1

[group.media.edges]
left = "round"
right = "round"
radius = 18

# Right-hand groups conventionally point the other way.
[group.power]
modules = ["brightness", "battery", "charging"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.power.separator]
shape = "chevron"
width = 11
direction = "left"
color = "previous"
overlap = 1

# A single module has no interior gap, so no separator is drawn.
[group.time]
modules = ["clock"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

# ---------------------------------------------------------------------------
# Modules
#
# "style" names a [style.*] table; any other key overrides it for this module.
# Module styles are keyed by block name, so a block placed in two groups would
# share one style; here each block appears once.
# ---------------------------------------------------------------------------

# Fixed icons.
[module.cpu]
style = "cool"
icon = "cpu"

[module.memory]
style = "warm"
icon = "memory"

[module.disk]
style = "mint"
icon = "disk"

[module.ethernet]
style = "plain"
icon = "ethernet"

[module.ethernet.states.hover]
hover = true
style = "hovered"

[module.clock]
style = "cool"
icon = "clock"
icon_size = 18 # an explicit override; otherwise icons follow the font

# The off states. Nothing picks these automatically yet, so they are named
# outright; a value-driven variant is what module state styling will add.
[module.offline]
style = "plain"
icon = "wifi-off"

[module.offline.states.hover]
hover = true
style = "hovered"

[module.muted]
style = "warm"
icon = "volume-muted"

[module.charging]
style = "cool"
icon = "battery-charging"

[module.headphones]
style = "mint"
icon = "headphones"

# Graded icons. Each reads a percentage out of the text beside it and picks one
# of five steps; a module whose text carries no percentage stays at the lowest.
[module.wifi]
style = "plain"
icon = "wifi"

[module.wifi.states.hover]
hover = true
style = "hovered"

[module.volume]
style = "cool"
icon = "volume"

[module.brightness]
style = "mint"
icon = "brightness"

[module.battery]
style = "stone"
icon = "battery"

# A state overlays the module's own style rather than replacing it, so the icon
# set above survives and keeps grading. Rules are checked tightest bound first,
# so "below 15" wins over "below 30" at 10%.
[module.battery.states.warning]
below = 30
style = "warning"

[module.battery.states.critical]
below = 15
style = "critical"

# A state can key on the provider's urgent flag instead of a value.
[module.disk.states.full]
urgent = true
style = "critical"
