# dbar - the full configuration surface.
#
#   dbar -c examples/showcase.toml
#
# A realistic bar: every block the provider sends appears exactly once, spread
# across four groups and all three positions, each group using a different
# separator shape.
#
# Blocks are named by [status] blocks below, in the order the provider emits
# them, so install the matching provider config first:
#
#   cp examples/i3status-rs.toml ~/.config/i3status-rust/config.toml
#
# If a group's module list matches nothing, dbar logs a warning naming the block
# names the provider is really sending. Run with RUST_LOG=dbar=debug to see it.

# ---------------------------------------------------------------------------
# Bar surface
# ---------------------------------------------------------------------------

[bar]
height = 36
position = "top"            # "top" | "bottom"
margin = 8                  # gap between the bar and the screen edge; floats the bar
gap = 12                    # horizontal space between groups
font = "Liberation Sans 14"
# Base icon size for the whole bar. Styles and modules override it; left out
# entirely, it defaults to 1.4x the font size, so icons scale with the text.
icon_size = 20
# For glyph icons, set icons = "material-nf" in the provider config and name a
# font that carries them here, e.g. "DejaVuSansM Nerd Font Propo 10".
exclusive = true # reserve the space so windows do not sit under the bar

[bar.background]
# Drawn under every group. Transparent here, so the groups read as separate
# floating islands.
color = "#00000000" # the last two hex digits are alpha
radius = 0

[status]
command = "i3status-rs"
# The i3bar protocol gives a provider no way to name its blocks usefully -
# i3status-rs numbers them "0", "1", ... - so name them here, in the order the
# provider emits them. Groups and modules below select on these names, and a
# reordering of the provider config becomes a one-line change here instead of a
# silent mismatch. Without this, groups have to select on "0", "1", ...
blocks = [
  "cpu",
  "memory",
  "disk",
  "wifi",
  "ethernet",
  "offline",
  "volume",
  "muted",
  "headphones",
  "brightness",
  "battery",
  "charging",
  "clock",
]
# i3status-rs resolves a bare filename against $XDG_CONFIG_HOME/i3status-rust and
# ignores the working directory, so pass an absolute path or leave this empty.
args = []

# ---------------------------------------------------------------------------
# Named colors, referenced elsewhere as "$name"
# ---------------------------------------------------------------------------

[colors]
background = "#1e1e2e"
surface = "#313244cc"  # alpha cc, so SwayFX blur shows through
slate = "#585b70ff"
overlay = "#45475aff"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#89b4fa"
teal = "#94e2d5"
warning = "#f9e2af"
critical = "#f38ba8"

# ---------------------------------------------------------------------------
# Positions
#
# Each position holds an ordered list of groups, so one position can carry
# several islands.
# ---------------------------------------------------------------------------

[left]
groups = ["system", "network"]

[center]
groups = ["media"]

[right]
groups = ["power", "time"]

# ---------------------------------------------------------------------------
# Reusable styles
#
# Resolution order: built-in defaults, then the named style a module picks, then
# that module's own inline keys.
# ---------------------------------------------------------------------------

[style.default]
foreground = "$text"
padding = 9

# Filled transitions need neighbouring modules to contrast, so these alternate.
[style.cool]
background = "$accent"
foreground = "$background"
padding = 9

[style.warm]
background = "$warning"
foreground = "$background"
padding = 9

[style.mint]
background = "$teal"
foreground = "$background"
padding = 9

[style.stone]
background = "$slate"
foreground = "$text"
padding = 9

# No background of its own, so the group background shows through continuously.
# Hover is paint-only: background, foreground and radius. Anything affecting
# metrics is ignored, so a module cannot resize under the pointer.
[style.hovered]
background = "$overlay"

[style.plain]
foreground = "$text"
padding = 12

[style.warning]
background = "$warning"
foreground = "$background"
padding = 9

[style.critical]
background = "$critical"
foreground = "$background"
padding = 9

# ---------------------------------------------------------------------------
# Groups
#
# A separator is a transition between two neighbouring modules, drawn as vector
# geometry rather than as a font glyph:
#
#   shape      none | line | slant | chevron | notch | round | curve
#   width      horizontal space the transition occupies
#   direction  "right" | "left"; mirrors the shape
#   color      previous | next | foreground | background, or a color / "$name"
#   overlap    bleed past each side, hiding antialiasing seams
#
# With shape = "none" the group falls back to its own `spacing` for the gap.
# Change any `shape` below to see the others; the geometry is the same for all.
#
# Outer corners are a separate concept from the separators between modules:
#
#   left/right "round" | "none"
#   radius     defaults to the group's own radius
# ---------------------------------------------------------------------------

# CPU, memory and disk, joined by slanted transitions.
[group.system]
modules = ["cpu", "memory", "disk"]
background = "$surface"
radius = 12
padding = 0
spacing = 0                         # only used when the group has no separator

[group.system.separator]
shape = "slant"
width = 11
direction = "right"
color = "previous"
overlap = 1

[group.system.edges]
left = "round"
right = "none" # a squared trailing edge
radius = 12

# Connectivity. A hairline divides rather than transitioning between two
# regions, so it takes the separator color itself and is never mirrored. It
# suits modules that share a background: the group reads as one surface with a
# divider in it, which is why these modules carry no background of their own.
[group.network]
modules = ["wifi", "ethernet", "offline"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.network.separator]
shape = "line"
width = 11
direction = "right"
color = "$subtext"
overlap = 0

# Volume, joined by a rounded lobe.
[group.media]
modules = ["volume", "muted", "headphones"]
background = "$surface"
radius = 18
padding = 0
spacing = 0

[group.media.separator]
shape = "round"
width = 13
direction = "right"
color = "previous"
overlap = 1

[group.media.edges]
left = "round"
right = "round"
radius = 18

# Right-hand groups conventionally point the other way.
[group.power]
modules = ["brightness", "battery", "charging"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

[group.power.separator]
shape = "chevron"
width = 11
direction = "left"
color = "previous"
overlap = 1

# A single module has no interior gap, so no separator is drawn.
[group.time]
modules = ["clock"]
background = "$surface"
radius = 12
padding = 0
spacing = 0

# ---------------------------------------------------------------------------
# Modules
#
# "style" names a [style.*] table; any other key overrides it for this module.
# Module styles are keyed by block name, so a block placed in two groups would
# share one style; here each block appears once.
# ---------------------------------------------------------------------------

# Fixed icons.
[module.cpu]
style = "cool"
icon = "cpu"

[module.memory]
style = "warm"
icon = "memory"

[module.disk]
style = "mint"
icon = "disk"

[module.ethernet]
style = "plain"
icon = "ethernet"

[module.ethernet.states.hover]
hover = true
style = "hovered"

[module.clock]
style = "cool"
icon = "clock"
icon_size = 18 # an explicit override; otherwise icons follow the font

# The off states. Nothing picks these automatically yet, so they are named
# outright; a value-driven variant is what module state styling will add.
[module.offline]
style = "plain"
icon = "wifi-off"

[module.offline.states.hover]
hover = true
style = "hovered"

[module.muted]
style = "warm"
icon = "volume-muted"

[module.charging]
style = "cool"
icon = "battery-charging"

[module.headphones]
style = "mint"
icon = "headphones"

# Graded icons. Each reads a percentage out of the text beside it and picks one
# of five steps; a module whose text carries no percentage stays at the lowest.
[module.wifi]
style = "plain"
icon = "wifi"

[module.wifi.states.hover]
hover = true
style = "hovered"

[module.volume]
style = "cool"
icon = "volume"

[module.brightness]
style = "mint"
icon = "brightness"

[module.battery]
style = "stone"
icon = "battery"

# A state overlays the module's own style rather than replacing it, so the icon
# set above survives and keeps grading. Rules are checked tightest bound first,
# so "below 15" wins over "below 30" at 10%.
[module.battery.states.warning]
below = 30
style = "warning"

[module.battery.states.critical]
below = 15
style = "critical"

# A state can key on the provider's urgent flag instead of a value.
[module.disk.states.full]
urgent = true
style = "critical"
