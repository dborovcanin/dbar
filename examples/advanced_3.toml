# advanced_3 - Gruvbox signal ribbon.
#
# Two continuous ribbons with slanted transitions between every block.
# Desktop and playback share the left ribbon; all status blocks share the right.
# There are no intermediate group caps or gaps to interrupt either ribbon.
#
# Run: dbar -c examples/advanced_3.toml
# Inspiration: https://github.com/sejjy/mechabar (stepped backgrounds and vector-like dividers)
#
# Same modules, readings, refresh intervals and controls as advanced.toml.
# Weather and calendar retain its machine-specific script/key paths: adjust
# module.weather.command, module.weather.params and module.clock.on_click locally.
# Weather needs curl, jq and an OpenWeather key; see examples/weather.sh.
# Font fallback is auto-detected. Text caps keep long titles, SSIDs and forecasts
# from taking over the bar; alternate formats and weather paging still work.

[bar]
height = 30
position = "top"
layer = "bottom"
margin = 0
gap = 0
font = "monospace 13"
icon_size = 16

[bar.background]
color = "$background"
radius = 0

[colors]
background = "#282828"
surface = "#3c3836"
raised = "#504945"
text = "#ebdbb2"
subtext = "#bdae93"
accent = "#83a598"
warning = "#fabd2f"
critical = "#fb4934"
ink = "#1d2021"
line = "#7c6f64"
secondary = "#b8bb26"

[left]
groups = ["desktop"]

[center]
groups = []

[right]
groups = ["status"]

# Styles: alarms retain distinct fills in every palette. Hover never changes size.

[style.panel]
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile]
background = "$surface"
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile_alt]
background = "$raised"
foreground = "$text"
padding = 5
icon_gap = 3

[style.warning]
background = "$warning"
foreground = "$ink"
padding = 5
icon_gap = 3

[style.critical]
background = "$critical"
foreground = "$ink"
padding = 5
icon_gap = 3

[style.pill]
background = "$raised"
foreground = "$text"
padding = 7
radius = 0

[style.focused]
background = "$accent"
foreground = "$ink"
padding = 7
radius = 0

[style.dim]
foreground = "$subtext"
padding = 7
background = "$surface"

[style.hovered]
background = "$raised"
foreground = "$text"

[style.accent]
background = "$accent"
foreground = "$ink"
padding = 5
icon_gap = 3

# One group per alignment lets each separator blend the actual neighboring fills,
# including warning colors and changes when media or tray items appear/disappear.
# Only the outer trailing edge has a cap. Modules provide all background fills.

[group.desktop]
modules = ["workspaces", "mode", "title", "media"]
background = "#00000000"
radius = 0
padding = 0
spacing = 0

[group.desktop.separator]
shape = "slant"
width = 6
direction = "right"
color = "previous"

[group.desktop.ends]
left = "none"
right = "slant"
width = 6

[group.status]
modules = ["weather", "clock", "cpu", "memory", "temperature", "language", "network", "tray", "volume", "brightness", "battery"]
background = "#00000000"
radius = 0
padding = 0
spacing = 0

[group.status.separator]
shape = "slant"
width = 6
direction = "right"
color = "previous"

[group.status.ends]
left = "none"
right = "slant"
width = 6

[menu]
background = "$surface"
foreground = "$text"
highlight = "$raised"
disabled = "$subtext"
separator = "$raised"
radius = 0
highlight_foreground = "$text"

# Modules: formats, actions, state thresholds and source options come from advanced.toml.

[module.workspaces]
source = "sway:workspaces"
style = "dim"
min_width = 27

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.visible]
visible = true
style = "pill"

[module.workspaces.states.urgent]
urgent = true
style = "critical"
radius = 0

[module.tray]
source = "tray"
style = "tile_alt"
padding = 6

[module.tray.states.attention]
field = "status"
equals = "attention"
background = "$critical"

[module.media]
source = "media"
controls = true
collapsible = true
format = "{$artist  }$title"
style = "tile_alt"
max_width = 120
icon = "pause"

[module.media.states.paused]
field = "status"
equals = "paused"
foreground = "$subtext"
icon = "play"

[module.mode]
source = "sway:mode"
format = "$mode"
style = "panel"
foreground = "$ink"
icon = "keyboard"
background = "$warning"

[module.title]
source = "sway:window"
style = "tile"
max_width = 130

[module.cpu]
source = "cpu"
interval = "2s"
format = "$utilization.n(d:0)"
min_width = 56
style = "tile"
icon = "cpu"

[module.cpu.states.busy]
above = 85
style = "warning"

[module.cpu.states.unreadable]
state = "error"
style = "critical"

[module.memory]
source = "memory"
interval = "5s"
format = "$percent.n(d:0)"
format_alt = "$used.n(d:1) of $total.n(d:0){  swap $swap_percent}"
min_width = 56
style = "tile_alt"
icon = "memory"

[module.memory.states.full]
above = 90
style = "warning"

[module.temperature]
source = "temperature"
interval = "5s"
format = "$temp.n(d:0)"
format_alt = "$temp.n(d:0) $label"
min_width = 56
style = "tile"
icon = "temperature"

[module.temperature.states.warm]
state = "warning"
style = "warning"

[module.temperature.states.hot]
state = "critical"
style = "critical"

[module.language]
source = "sway:language"
format = "$short"
format_alt = "$layout"
style = "tile_alt"
icon = "keyboard"

[module.language.layouts]
"English (US)" = "EN"
"Serbian (Latin)" = "SR"
"Serbian" = "RS"

[module.network]
source = "network"
interval = "2s"
format = "$ssid|$device"
format_alt = ["$down{  $up}", "$signal.n(d:0){  $dbm.n(d:0) dBm}"]
style = "tile"
icon = "wifi"
max_width = 100

[module.network.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
format_alt = "$volume.n(d:0)  $device"
min_width = 56
style = "tile"
icon = "volume"

[module.volume.states.headphones_muted]
fields = { "muted" = "yes", "port" = "headphones" }
foreground = "$subtext"
icon = "headphones-muted"

[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "volume-muted"

[module.volume.states.port]
field = "port"
equals = "headphones"
icon = "headphones"

[module.brightness]
source = "backlight"
scroll = "5%"
format = "$brightness.n(d:0)"
min_width = 56
style = "tile_alt"
icon = "brightness"

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = ["$percent.n(d:0)  $status{  $power.n(d:1)}  health $health.n(d:0)", "$percent.n(d:0){  $time.dur(style:short) left}"]
min_width = 56
style = "tile"
icon = "battery"

[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "battery-charging"

[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

# Middle click refreshes, right click changes wording, wheel changes location.
[module.weather]
source = "command"
command = ["/home/dusan/dotfiles/scripts/dbar/weather.sh"]
params = ["metric", "/home/dusan/.config/dbar/owm.key", "45.2517,19.8369", "44.8147,20.4143", "43.9365,18.7986"]
interval = "once"
pages = true
refresh_button = "middle"
alt_button = "right"
fields = { "icon" = "text", "weather" = "text", "location" = "text", "temp" = "number", "wind" = "number", "direction" = "text", "forecast_icon" = "text", "forecast_avg" = "number", "forecast_min" = "number", "forecast_max" = "number" }
format = "{$icon }$weather|'unavailable'{ ($location)}{ $temp.n(d:0) °C}{, $wind.n(d:1) m/s $direction}"
format_alt = ["{$forecast_icon }{$location, }next 9 h: $forecast_avg.n(d:0)|'unavailable'{ °C ($forecast_min.n(d:0) to $forecast_max.n(d:0))}", "{$icon }$temp.n(d:0)|'unavailable'"]
style = "tile"
max_width = 120

[module.weather.states.stale]
state = "error"
foreground = "$subtext"

# Left click opens the same external calendar as advanced.toml.
[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%a %d %b  %H:%M')"
on_click = { "left" = ["/home/dusan/dotfiles/scripts/dbar/sway_calendar.sh"] }
style = "accent"
foreground = "$ink"
icon = "clock"

