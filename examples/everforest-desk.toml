# Everforest workstation.
#
# A bottom bar organized around activity: desktop controls on the left, title
# and playback in the center, connectivity, sensors and power on the right.
# Rounded transitions and opaque earth tones suit a busy wallpaper.
#
# Run: dbar -c examples/everforest-desk.toml
# Inspiration: https://github.com/sejjy/mechabar (related readings share a stepped strip)
#
# Same modules, readings, refresh intervals and controls as gruvbox-islands.toml.
# Weather and the calendar click run the scripts beside this file. The weather
# wants curl, jq and a free OpenWeatherMap key in ~/.config/dbar/owm.key; with
# no key it draws "unavailable" and the rest of the bar is unaffected.
# Font fallback is auto-detected. Text caps keep long titles, SSIDs and forecasts
# from taking over the bar; alternate formats and weather paging still work.

[bar]
height = 32
position = "bottom"
layer = "bottom"
margin = 5
gap = 6
font = "sans-serif 13"
icon_size = 16

[bar.background]
color = "#00000000"

[colors]
background = "#2d353b"
surface = "#343f44"
raised = "#475258"
text = "#d3c6aa"
subtext = "#a3afa4"
accent = "#a7c080"
warning = "#dbbc7f"
critical = "#e67e80"
ink = "#232a2e"
line = "#65756c"
secondary = "#83c092"

[left]
groups = ["desktop", "world"]

[center]
groups = ["activity"]

[right]
groups = ["connections", "system", "power"]

# Styles: alarms retain distinct fills in every palette. Hover never changes size.

[style.panel]
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile]
background = "$surface"
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile_alt]
background = "$raised"
foreground = "$text"
padding = 5
icon_gap = 3

[style.warning]
background = "$warning"
foreground = "$ink"
padding = 5
icon_gap = 3

[style.critical]
background = "$critical"
foreground = "$ink"
padding = 5
icon_gap = 3

[style.pill]
background = "$raised"
foreground = "$text"
padding = 7
radius = 8

[style.focused]
background = "$accent"
foreground = "$ink"
padding = 7
radius = 8

[style.dim]
foreground = "$subtext"
padding = 7
background = "$surface"

[style.hovered]
background = "$raised"
foreground = "$text"

[style.accent]
background = "$accent"
foreground = "$ink"
padding = 5
icon_gap = 3

# Groups: each module is placed exactly once. Empty dynamic groups disappear.

[group.desktop]
modules = ["workspaces", "mode", "language"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.desktop.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.desktop.edges]
left = "round"
right = "round"

[group.world]
modules = ["clock", "weather"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.world.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.world.edges]
left = "round"
right = "round"

[group.activity]
modules = ["title", "media"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.activity.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.activity.edges]
left = "round"
right = "round"

[group.connections]
modules = ["network", "tray"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.connections.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.connections.edges]
left = "round"
right = "round"

[group.system]
modules = ["temperature", "cpu", "memory"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.system.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.system.edges]
left = "round"
right = "round"

[group.power]
modules = ["battery", "brightness", "volume"]
background = "$surface"
radius = 10
padding = 0
spacing = 0

[group.power.separator]
shape = "round"
width = 8
direction = "right"
color = "previous"

[group.power.edges]
left = "round"
right = "round"

[menu]
background = "$surface"
foreground = "$text"
highlight = "$raised"
disabled = "$subtext"
separator = "$raised"
radius = 8
highlight_foreground = "$text"

# Modules: formats, actions, state thresholds and source options come from gruvbox-islands.toml.

[module.workspaces]
source = "sway:workspaces"
style = "dim"
min_width = 27

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.visible]
visible = true
style = "pill"

[module.workspaces.states.urgent]
urgent = true
style = "critical"
radius = 8

[module.tray]
source = "tray"
style = "tile_alt"
padding = 6

[module.tray.states.attention]
field = "status"
equals = "attention"
background = "$critical"

[module.media]
source = "media"
controls = true
collapsible = true
format = "{$artist  }$title"
style = "tile_alt"
max_width = 160
icon = "pause"

[module.media.states.paused]
field = "status"
equals = "paused"
foreground = "$subtext"
icon = "play"

[module.mode]
source = "sway:mode"
format = "$mode"
style = "panel"
foreground = "$ink"
icon = "keyboard"
background = "$warning"

[module.title]
source = "sway:window"
style = "tile"
max_width = 180

[module.cpu]
source = "cpu"
interval = "2s"
format = "$utilization.n(d:0)"
min_width = 62
style = "tile_alt"
icon = "cpu"

[module.cpu.states.busy]
above = 85
style = "warning"

[module.cpu.states.unreadable]
state = "error"
style = "critical"

[module.memory]
source = "memory"
interval = "5s"
format = "$percent.n(d:0)"
format_alt = "$used.n(d:1) of $total.n(d:0){  swap $swap_percent}"
min_width = 62
style = "tile"
icon = "memory"

[module.memory.states.full]
above = 90
style = "warning"

[module.temperature]
source = "temperature"
interval = "5s"
format = "$temp.n(d:0)"
format_alt = "$temp.n(d:0) $label"
min_width = 62
style = "tile"
icon = "temperature"

[module.temperature.states.warm]
state = "warning"
style = "warning"

[module.temperature.states.hot]
state = "critical"
style = "critical"

[module.language]
source = "sway:language"
format = "$short"
format_alt = "$layout"
style = "tile"
icon = "keyboard"

[module.language.layouts]
"English (US)" = "EN"
"Serbian (Latin)" = "SR"
"Serbian" = "RS"

[module.network]
source = "network"
interval = "2s"
format = "$ssid|$device"
format_alt = ["$down{  $up}", "$signal.n(d:0){  $dbm.n(d:0) dBm}"]
style = "tile"
icon = "wifi"
max_width = 120

[module.network.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
format_alt = "$volume.n(d:0)  $device"
min_width = 62
style = "tile"
icon = "volume"

[module.volume.states.headphones_muted]
fields = { "muted" = "yes", "port" = "headphones" }
foreground = "$subtext"
icon = "headphones-muted"

[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "volume-muted"

[module.volume.states.port]
field = "port"
equals = "headphones"
icon = "headphones"

[module.brightness]
source = "backlight"
scroll = "5%"
format = "$brightness.n(d:0)"
min_width = 62
style = "tile_alt"
icon = "brightness"

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = ["$percent.n(d:0)  $status{  $power.n(d:1)}  health $health.n(d:0)", "$percent.n(d:0){  $time.dur(style:short) left}"]
min_width = 62
style = "tile"
icon = "battery"

[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "battery-charging"

[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

# Middle click refreshes, right click changes wording, wheel changes location.
[module.weather]
source = "command"
command = ["examples/weather.sh"]
params = ["metric", "~/.config/dbar/owm.key", "45.2517,19.8369", "44.8147,20.4143", "43.9365,18.7986"]
interval = "once"
pages = true
refresh_button = "middle"
alt_button = "right"
fields = { "icon" = "text", "weather" = "text", "location" = "text", "temp" = "number", "wind" = "number", "direction" = "text", "forecast_icon" = "text", "forecast_avg" = "number", "forecast_min" = "number", "forecast_max" = "number" }
format = "{$icon }$weather|'unavailable'{ ($location)}{ $temp.n(d:0) °C}{, $wind.n(d:1) m/s $direction}"
format_alt = ["{$forecast_icon }{$location, }next 9 h: $forecast_avg.n(d:0)|'unavailable'{ °C ($forecast_min.n(d:0) to $forecast_max.n(d:0))}", "{$icon }$temp.n(d:0)|'unavailable'"]
style = "tile_alt"
max_width = 140

[module.weather.states.stale]
state = "error"
foreground = "$subtext"

# Left click opens the same external calendar as gruvbox-islands.toml.
[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%a %d %b  %H:%M')"
on_click = { "left" = ["examples/sway_calendar.sh"] }
style = "accent"
foreground = "$ink"
icon = "clock"

