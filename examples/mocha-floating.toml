# Mocha islands.
#
# A floating top bar: desktop context on the left, date and weather in the middle,
# and three compact control islands on the right. Soft pills, no filled separators.
#
# Run: dbar -c examples/mocha-floating.toml
# Inspiration: https://github.com/catppuccin/waybar
#
# Same modules, readings, refresh intervals and controls as gruvbox-islands.toml.
# Weather and the calendar click run the scripts beside this file. The weather
# wants curl, jq and a free OpenWeatherMap key in ~/.config/dbar/owm.key; with
# no key it draws "unavailable" and the rest of the bar is unaffected.
# Font fallback is auto-detected. Text caps keep long titles, SSIDs and forecasts
# from taking over the bar; alternate formats and weather paging still work.

[bar]
height = 34
position = "top"
layer = "bottom"
margin = 6
gap = 6
font = "sans-serif 14"
icon_size = 17

[bar.background]
color = "#00000000"

[colors]
background = "#1e1e2e"
surface = "#313244"
raised = "#45475a"
text = "#cdd6f4"
subtext = "#a6adc8"
accent = "#cba6f7"
warning = "#f9e2af"
critical = "#f38ba8"
ink = "#11111b"
line = "#6c7086"
secondary = "#94e2d5"

[left]
groups = ["desktop", "mode", "window"]

[center]
groups = ["world"]

[right]
groups = ["playing", "system", "connections", "power"]

# Styles: alarms retain distinct fills in every palette. Hover never changes size.

[style.panel]
foreground = "$text"
padding = 6
icon_gap = 3

[style.tile]
background = "$surface"
foreground = "$text"
padding = 6
icon_gap = 3

[style.tile_alt]
background = "$raised"
foreground = "$text"
padding = 6
icon_gap = 3

[style.warning]
background = "$warning"
foreground = "$ink"
padding = 6
icon_gap = 3

[style.critical]
background = "$critical"
foreground = "$ink"
padding = 6
icon_gap = 3

[style.pill]
background = "$raised"
foreground = "$text"
padding = 7
radius = 13

[style.focused]
background = "$accent"
foreground = "$ink"
padding = 7
radius = 13

[style.dim]
foreground = "$subtext"
padding = 7

[style.hovered]
background = "$raised"
foreground = "$text"

[style.accent]
background = "$accent"
foreground = "$ink"
padding = 6
icon_gap = 3

# Groups: each module is placed exactly once. Empty dynamic groups disappear.

[group.desktop]
modules = ["workspaces"]
background = "$surface"
radius = 16
padding = 3
spacing = 2

[group.desktop.edges]
left = "round"
right = "round"

[group.mode]
modules = ["mode"]
background = "$warning"
radius = 16
padding = 0
spacing = 0

[group.mode.edges]
left = "round"
right = "round"

[group.window]
modules = ["title"]
background = "$surface"
radius = 16
padding = 0
spacing = 0

[group.window.edges]
left = "round"
right = "round"

[group.world]
modules = ["clock", "weather"]
background = "$surface"
radius = 16
padding = 0
spacing = 4

[group.world.edges]
left = "round"
right = "round"

[group.playing]
modules = ["media"]
background = "$surface"
radius = 16
padding = 0
spacing = 0

[group.playing.edges]
left = "round"
right = "round"

[group.system]
# Reserve middle click throughout this group; click the CPU icon with middle to expand.
collapsible = true
collapse_button = "middle"
# A fold on a pill this round is the awkward one: the island is 34 high with a 16
# radius, so its ends are very nearly semicircles and the readings travelling under
# the closing edge run straight into them. Text is clipped to the outline, corners
# included, rather than to a straight column at the edge.
collapse_animation = "2000ms"
modules = ["cpu", "memory", "temperature"]
background = "$surface"
radius = 16
padding = 2
spacing = 2

[group.system.collapsed]
style = "panel"
icon = "cpu"

[group.system.edges]
left = "round"
right = "round"

[group.connections]
modules = ["language", "network", "tray"]
background = "$surface"
radius = 16
padding = 0
spacing = 3

[group.connections.edges]
left = "round"
right = "round"

[group.power]
modules = ["volume", "brightness", "battery"]
background = "$surface"
radius = 16
padding = 2
spacing = 2

[group.power.edges]
left = "round"
right = "round"

[menu]
background = "$surface"
foreground = "$text"
highlight = "$raised"
disabled = "$subtext"
separator = "$raised"
radius = 13
highlight_foreground = "$text"

# Modules: formats, actions, state thresholds and source options come from gruvbox-islands.toml.

[module.workspaces]
source = "sway:workspaces"
style = "dim"
min_width = 27

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.visible]
visible = true
style = "pill"

[module.workspaces.states.urgent]
urgent = true
style = "critical"
radius = 13

[module.tray]
source = "tray"
style = "panel"
padding = 6

[module.tray.states.attention]
field = "status"
equals = "attention"
background = "$critical"

[module.media]
source = "media"
controls = true
collapsible = true
format = "{$artist  }$title"
style = "panel"
max_width = 120
icon = "pause"

[module.media.states.paused]
field = "status"
equals = "paused"
foreground = "$subtext"
icon = "play"

[module.mode]
source = "sway:mode"
format = "$mode"
style = "panel"
foreground = "$ink"
icon = "keyboard"
background = "$warning"

[module.title]
source = "sway:window"
style = "panel"
max_width = 140

[module.cpu]
source = "cpu"
interval = "2s"
format = "$utilization.n(d:0)"
min_width = 66
style = "panel"
icon = "cpu"

[module.cpu.states.busy]
above = 85
style = "warning"

[module.cpu.states.unreadable]
state = "error"
style = "critical"

[module.memory]
source = "memory"
interval = "5s"
format = "$percent.n(d:0)"
format_alt = "$used.n(d:1) of $total.n(d:0){  swap $swap_percent}"
min_width = 66
style = "panel"
icon = "memory"

[module.memory.states.full]
above = 90
style = "warning"

[module.temperature]
source = "temperature"
interval = "5s"
format = "$temp.n(d:0)"
format_alt = "$temp.n(d:0) $label"
min_width = 66
style = "panel"
icon = "temperature"

[module.temperature.states.warm]
state = "warning"
style = "warning"

[module.temperature.states.hot]
state = "critical"
style = "critical"

[module.language]
source = "sway:language"
format = "$short"
format_alt = "$layout"
style = "panel"
icon = "keyboard"

[module.language.layouts]
"English (US)" = "EN"
"Serbian (Latin)" = "SR"
"Serbian" = "RS"

[module.network]
source = "network"
interval = "2s"
format = "$ssid|$device"
format_alt = ["$down{  $up}", "$signal.n(d:0){  $dbm.n(d:0) dBm}"]
style = "panel"
icon = "wifi"
max_width = 100

[module.network.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
format_alt = "$volume.n(d:0)  $device"
min_width = 66
style = "panel"
icon = "volume"

[module.volume.states.headphones_muted]
fields = { "muted" = "yes", "port" = "headphones" }
foreground = "$subtext"
icon = "headphones-muted"

[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "volume-muted"

[module.volume.states.port]
field = "port"
equals = "headphones"
icon = "headphones"

[module.brightness]
source = "backlight"
scroll = "5%"
format = "$brightness.n(d:0)"
min_width = 66
style = "panel"
icon = "brightness"

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = [
  "$percent.n(d:0)  $status{  $power.n(d:1)}  health $health.n(d:0)",
  "$percent.n(d:0){  $time.dur(style:short) left}",
]
min_width = 66
style = "panel"
icon = "battery"

[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "battery-charging"

[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

# Middle click refreshes, right click changes wording, wheel changes location.
[module.weather]
source = "command"
command = ["examples/weather.sh"]
params = [
  "metric",
  "~/.config/dbar/owm.key",
  "45.2517,19.8369",
  "44.8147,20.4143",
  "43.9365,18.7986",
]
interval = "once"
pages = true
refresh_button = "middle"
alt_button = "right"
fields = { "icon" = "text", "weather" = "text", "location" = "text", "temp" = "number", "wind" = "number", "direction" = "text", "forecast_icon" = "text", "forecast_avg" = "number", "forecast_min" = "number", "forecast_max" = "number" }
format = "{$icon }$weather|'unavailable'{ ($location)}{ $temp.n(d:0) °C}{, $wind.n(d:1) m/s $direction}"
format_alt = [
  "{$forecast_icon }{$location, }next 9 h: $forecast_avg.n(d:0)|'unavailable'{ °C ($forecast_min.n(d:0) to $forecast_max.n(d:0))}",
  "{$icon }$temp.n(d:0)|'unavailable'",
]
style = "panel"
max_width = 120

[module.weather.states.stale]
state = "error"
foreground = "$subtext"

# Left click opens the same external calendar as gruvbox-islands.toml.
[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%a %d %b  %H:%M')"
on_click = { "left" = ["examples/sway_calendar.sh"] }
style = "panel"
foreground = "$accent"
icon = "clock"
