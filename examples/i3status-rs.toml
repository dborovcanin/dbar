# A small i3status-rs config to feed dbar, with enough blocks for
# examples/showcase.toml to place each of them exactly once.
#
# Copy to ~/.config/i3status-rust/config.toml, or pass an absolute path:
#
#   [status]
#   command = "i3status-rs"
#   args = ["/absolute/path/to/i3status-rs.toml"]
#
# "native" leaves colors and separators to dbar instead of baking them into the
# protocol output. Blocks are named by position, so this file's order decides
# the "0", "1", ... names, which showcase.toml then renames under [status].
#
# Every block below formats as "$icon $value", and the icon set decides what
# "$icon" becomes. The set named below is the only thing standing between glyph
# icons and plain text:
#
#   none          not "no icon" - short text labels instead: CPU, MEM, DISK, ...
#                 works with any font, which is why it is the default here
#   material-nf   glyph icons; needs a font that carries them, so pair it with
#                 a Nerd Font in the dbar config
#
# Other sets: awesome4, awesome5, awesome6, material, emoji.
#
# dbar draws its own icons from [module.*] icon = "...", which is independent of
# all of the above. The showcase uses those and leaves "$icon" as a text label.

[theme]
theme = "native"

[icons]
icons = "none"

[[block]]
block = "cpu"
format = " $utilization "

# format_alt toggles on click, and dbar forwards clicks to the provider, so this
# module expands to used/total when clicked and collapses again.
[[block]]
block = "memory"
format = " $mem_used_percents "
format_alt = " $mem_used/$mem_total "

[[block]]
block = "disk_space"
path = "/"
format = " $free "

# Signal strength, so dbar's graded wifi icon has a percentage to read.
[[block]]
block = "net"
format = " $signal_strength "

# Placeholders, so the showcase can demonstrate icons that nothing selects
# automatically yet: wired, disconnected, muted, headphones and charging. A real
# config would drive these from actual state. The charging one reports a
# percentage, because that icon grades on it just as the plain battery does.
[[block]]
block = "custom"
command = "echo LAN"
interval = 3600

[[block]]
block = "custom"
command = "echo offline"
interval = 3600

[[block]]
block = "sound"
format = " $volume "

[[block]]
block = "custom"
command = "echo muted"
interval = 3600

[[block]]
block = "custom"
command = "echo headphones"
interval = 3600

[[block]]
block = "backlight"
format = " $brightness "

[[block]]
block = "battery"
format = " $percentage "

[[block]]
block = "custom"
command = "echo 72%"
interval = 3600

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d %b %H:%M') "
