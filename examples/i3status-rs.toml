# A small i3status-rs config to feed dbar, with enough blocks that
# examples/showcase.toml can spread them across several groups.
#
# Copy to ~/.config/i3status-rust/config.toml, or pass an absolute path:
#
#   [status]
#   command = "i3status-rs"
#   args = ["/absolute/path/to/i3status-rs.toml"]
#
# "native" leaves colors and separators to dbar instead of baking them into the
# protocol output. Blocks are named by position, so this file's order decides
# the "0", "1", ... names that showcase.toml selects on.

[theme]
theme = "native"
[icons]
icons = "none"

[[block]]
block = "cpu"
format = " CPU $utilization "

[[block]]
block = "memory"
format = " RAM $mem_used_percents "

[[block]]
block = "disk_space"
path = "/"
format = " DISK $free "

[[block]]
block = "load"
format = " LOAD $1m "

[[block]]
block = "net"
format = " NET $speed_down "

[[block]]
block = "sound"
format = " VOL $volume "

[[block]]
block = "uptime"
format = " UP $uptime "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%H:%M') "
