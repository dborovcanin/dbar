# Everforest, along the bottom, with the window title in the middle.
#
#   dbar -c examples/everforest.toml
#
# A bar at the bottom is read differently from one at the top: it is where the
# eye rests rather than where it starts, so this one puts the thing that
# changes most - what you are looking at - in the middle where it is found
# without looking, and keeps the numbers out at the right.
#
# The transitions are `round`: two quarter-ellipses meeting at a point, which
# is the softest of the filled shapes and the one that suits a palette with no
# hard edges in it.

[bar]
height = 30
position = "bottom"
margin = 5
gap = 6
font = "sans-serif 16"
icon_size = 17

[colors]
# Everforest dark, medium contrast.
base = "#2d353b"      # bg0
surface = "#343f44"   # bg1
raised = "#3d484d"    # bg2
line = "#475258"      # bg3
text = "#d3c6aa"      # fg
subtext = "#859289"   # grey1
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
warning = "#dbbc7f"   # yellow
critical = "#e67e80"  # red

[left]
groups = ["desktop"]

[center]
groups = ["window"]

[right]
groups = ["system", "power", "time"]

# ---------------------------------------------------------------------------
# Styles
# ---------------------------------------------------------------------------

[style.plain]
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile]
background = "$surface"
foreground = "$text"
padding = 5
icon_gap = 3

[style.tile_alt]
background = "$raised"
foreground = "$text"
padding = 5
icon_gap = 3

[style.warning]
background = "$warning"
foreground = "$base"
padding = 5
icon_gap = 3

[style.critical]
background = "$critical"
foreground = "$base"
padding = 5
icon_gap = 3

[style.focused]
background = "$green"
foreground = "$base"
padding = 8
radius = 8

[style.visible]
background = "$raised"
foreground = "$text"
padding = 8
radius = 8

[style.dim]
foreground = "$subtext"
padding = 8

[style.hovered]
background = "$line"
foreground = "$text"

# ---------------------------------------------------------------------------
# Groups
#
# `opacity` fades each island once it is finished, which is what lets SwayFX
# blur what is behind it without the fills inside compositing against each
# other. The colours themselves stay opaque.
# ---------------------------------------------------------------------------

[group.desktop]
modules = ["workspaces"]
background = "$surface"
opacity = 0.92
radius = 10
padding = 3
spacing = 3

[group.window]
modules = ["title"]
background = "$surface"
opacity = 0.92
radius = 10

[group.system]
modules = ["cpu", "memory", "temperature", "network"]
opacity = 0.92
radius = 10

[group.system.separator]
shape = "round"
width = 14
direction = "right"
color = "previous"
overlap = 1

[group.power]
modules = ["volume", "brightness", "battery"]
opacity = 0.92
radius = 10

[group.power.separator]
shape = "round"
width = 14
direction = "right"
color = "previous"
overlap = 1

[group.time]
modules = ["clock"]
background = "$aqua"
opacity = 0.92
radius = 10

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------

[module.workspaces]
source = "sway:workspaces"
style = "dim"
min_width = 28

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.visible]
visible = true
style = "visible"

[module.workspaces.states.urgent]
urgent = true
style = "critical"
radius = 8

[module.title]
source = "sway:window"
style = "plain"
max_width = 460

[module.cpu]
source = "cpu"
interval = "2s"
format = "$utilization.n(d:0)"
style = "tile"
icon = "cpu"
min_width = 66

[module.cpu.states.busy]
above = 85
style = "warning"

[module.memory]
source = "memory"
interval = "5s"
format = "$percent.n(d:0)"
format_alt = "$used.n(d:1) of $total.n(d:0)"
style = "tile_alt"
icon = "memory"
min_width = 66

[module.memory.states.full]
above = 90
style = "warning"

[module.temperature]
source = "temperature"
interval = "5s"
format = "$temp.n(d:0)"
style = "tile"
icon = "temperature"
min_width = 68

[module.temperature.states.hot]
state = "critical"
style = "critical"

[module.network]
source = "network"
interval = "2s"
format = "$ssid|$device"
format_alt = "$down{  $up}"
style = "tile_alt"
icon = "wifi"

[module.network.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

[module.volume]
source = "audio"
scroll = "5%"
format = "$volume.n(d:0)"
style = "tile"
icon = "volume"
min_width = 66

[module.volume.states.headphones_muted]
fields = { muted = "yes", port = "headphones" }
foreground = "$subtext"
icon = "headphones-muted"

[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "volume-muted"

[module.volume.states.port]
field = "port"
equals = "headphones"
icon = "headphones"

[module.brightness]
source = "backlight"
scroll = "5%"
format = "$brightness.n(d:0)"
style = "tile_alt"
icon = "brightness"
min_width = 66

[module.battery]
source = "battery"
interval = "30s"
format = "$percent.n(d:0)"
format_alt = "$percent.n(d:0){  $time.dur(style:short) left}"
style = "tile"
icon = "battery"
min_width = 66

[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "battery-charging"

[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

[module.clock]
source = "time"
interval = "1m"
format = "$now.time(f:'%a %d %b  %H:%M')"
style = "plain"
foreground = "$base"
icon = "clock"
