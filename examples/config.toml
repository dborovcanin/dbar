# dbar default configuration.
#
# This is what dbar compiles in and uses when no config file exists. Copy it to
# ~/.config/dbar/config.toml and edit, or write it out with:
#
#   dbar --print-config > ~/.config/dbar/config.toml
#
# Everything here is read by dbar itself, so nothing else has to be installed,
# configured or running. See examples/showcase.toml for every key dbar
# understands, including how to bring in an external i3bar provider for the
# things dbar cannot read yet.

[bar]
height = 34
position = "top"
margin = 6
gap = 6
# Kept font-agnostic, since this is the built-in default. Icon sizes follow it
# unless [bar] icon_size says otherwise.
font = "sans-serif 10"

[bar.background]
# Fully transparent, so the group below reads as a floating island.
color = "#00000000"
radius = 0

[colors]
background = "#1e1e2e"
surface = "#313244cc"   # alpha cc, so SwayFX blur shows through
text = "#cdd6f4"
warning = "#f9e2af"
critical = "#f38ba8"

[style.default]
foreground = "$text"
padding = 8

# `source` is what dbar reads; `interval` is how often, and it needs a unit so
# that "2s" cannot be misread as two of something else. Both the interval and
# the wording have sensible defaults, so a module that wants the ordinary thing
# says only where it comes from.
#
# The fields a format may name are the ones its source publishes:
#
#   cpu         $utilization
#   memory      $percent $used $total $available
#               $swap_percent $swap_used $swap_total
#   battery     $percent $status $power $time $health $threshold
#   backlight   $brightness $device
#   time        $now
[module.cpu]
source = "cpu"
interval = "2s"
# A fixed width stops the module resizing every time the number crosses ten.
format = " $utilization.n(w:4) "
style = "default"
icon = "cpu"

[module.cpu.states.busy]
above = 80
foreground = "$warning"

[module.memory]
source = "memory"
interval = "5s"
format = " $percent.n(w:4) "
# A left click swaps to this and back.
format_alt = " $used.n(d:1) of $total.n(d:0){  swap $swap_percent} "
style = "default"
icon = "memory"

[module.memory.states.high]
above = 85
foreground = "$critical"

# A machine with no backlight publishes nothing for it, and a module with
# nothing to report is not drawn at all.
#
# `signal` reads it again on demand: bind a brightness key to
# `brightnessctl set +10%; pkill -RTMIN+8 dbar` and the bar keeps up.
[module.backlight]
source = "backlight"
signal = 8
format = " $brightness.n(w:4) "
style = "default"
icon = "brightness"

# A machine with no battery publishes nothing for it, so this module simply is
# not drawn on a desktop. Braces hold the parts that only apply sometimes: no
# time remaining while it sits on mains, and no cap unless something is holding
# charging back, as TLP does.
[module.battery]
source = "battery"
interval = "30s"
format = " $percent.n(w:4){  $time.dur(style:short) left}{  cap $threshold} "
style = "default"
icon = "battery"

# `equals` matches a word the source published, rather than the wording a format
# happened to produce.
[module.battery.states.charging]
field = "status"
equals = "charging"
icon = "battery-charging"

# The battery decides for itself when it is worth alarming about, and only does
# so while actually draining: 10% with the charger in is not a problem.
[module.battery.states.low]
state = "warning"
foreground = "$warning"

[module.battery.states.flat]
state = "critical"
foreground = "$critical"

[module.clock]
source = "time"
# Read once a minute, and the reading lands on the minute rather than drifting
# from whenever dbar happened to start.
interval = "1m"
format = " $now.time(f:'%a %d %b  %H:%M') "
style = "default"
icon = "clock"

[right]
groups = ["system", "clock"]

[group.system]
modules = ["cpu", "memory", "backlight", "battery"]
background = "$surface"
radius = 10
padding = 4
spacing = 0

[group.clock]
modules = ["clock"]
background = "$surface"
radius = 10
padding = 4
