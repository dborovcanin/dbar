# dbar default configuration.
#
# This is what dbar compiles in and uses when no config file exists. Copy it to
# ~/.config/dbar/config.toml and edit, or write it out with:
#
#   dbar --print-config > ~/.config/dbar/config.toml
#
# See examples/showcase.toml for every key dbar understands.

[bar]
height = 34
position = "top"
margin = 6
gap = 6
# Kept font-agnostic, since this is the built-in default. Icon sizes follow it
# unless [bar] icon_size says otherwise.
font = "sans-serif 10"

[bar.background]
# Fully transparent, so the group below reads as a floating island.
color = "#00000000"
radius = 0

# Declaring blocks here is "generated mode": dbar writes the provider's own
# configuration and starts it against that, so there is one file to maintain.
# Every key except `name` is passed through to the provider untouched.
[status]
command = "i3status-rs"

[status.theme]
theme = "native"

[status.icons]
icons = "none"

[[status.block]]
name = "cpu"
block = "cpu"
format = " $icon $utilization "

[[status.block]]
name = "memory"
block = "memory"
format = " $icon $mem_used_percents "

[[status.block]]
name = "disk"
block = "disk_space"
path = "/"
format = " $icon $free "

[[status.block]]
name = "volume"
block = "sound"
format = " $icon $volume "

[[status.block]]
name = "clock"
block = "time"
interval = 5
format = " $icon $timestamp.datetime(f:'%a %d %b %H:%M') "

[colors]
background = "#1e1e2e"
surface = "#313244cc"   # alpha cc, so SwayFX blur shows through
text = "#cdd6f4"

[right]
groups = ["system"]

[style.default]
foreground = "$text"
padding = 8

[group.system]
# "*" takes every block the provider emits, in the order it sends them. Naming
# them explicitly, as showcase.toml does, allows per-module styling.
modules = ["*"]
background = "$surface"
radius = 10
padding = 4
spacing = 0

[module.default]
style = "default"
