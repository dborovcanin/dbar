# dbar - a bar to actually live with.
#
# showcase.toml names every key dbar understands, which makes it a reference
# rather than something to run: it mixes six separator shapes, and it needs an
# external provider installed before it will start without an error.
#
# This is the other thing - one coherent bar, every module read by dbar itself,
# nothing to install and nothing to configure elsewhere. Everything on it is a
# real reading from this machine.
#
# The bar is quiet by default: colour means something is wrong, so on an idle
# machine there is none. Thresholds are set where a person would actually want
# to look, not where they make a screenshot colourful.

[bar]
height = 34
position = "top"
# The bar sits under floating windows, so one dragged across the top of the
# screen passes over it rather than behind it. Tiled windows never reach it -
# the exclusive zone keeps the strip to itself.
layer = "bottom"
margin = 3
gap = 3
font = "sans-serif 18"
icon_size = 20

# ---------------------------------------------------------------------------
# Colours - Gruvbox dark.
#
# The two greys are the whole of the bar's own weight: `surface` is what an
# island is made of, `raised` is the same material one step lighter. Everything
# with a hue on it means something - focus, or a reading worth looking at.
#
# Both are opaque. What SwayFX blurs through is the groups' own `opacity`, which
# fades each island once it is finished rather than fading the colours that go
# into it - see the note there.
# ---------------------------------------------------------------------------

[colors]
background = "#282828" # bg0
surface = "#3c3836"    # bg1
raised = "#504945"     # bg2, the same island one shade up
text = "#ebdbb2"       # fg1
subtext = "#a89984"    # fg4
accent = "#83a598"     # bright blue
warning = "#fabd2f"    # bright yellow
critical = "#fb4934"   # bright red

[left]
groups = ["desktop", "window"]

[right]
groups = ["playing", "system", "network", "power", "time"]

# ---------------------------------------------------------------------------
# Styles
#
# `panel` is worn by anything that sits alone on its group's own background.
# `tile` and `tile_alt` are for the groups that hold several modules: they
# alternate, because the curve between two modules is filled from the module
# behind it, so a boundary only exists where the two sides differ.
#
# The two alarms are what a state rule swaps in when a reading stops being
# ordinary. The rest exist for the workspaces, which are the one place on the
# bar where several things are true at once.
# ---------------------------------------------------------------------------

[style.panel]
foreground = "$text"
padding = 6

[style.tile]
background = "$surface"
foreground = "$text"
padding = 6

[style.tile_alt]
background = "$raised"
foreground = "$text"
padding = 6

[style.warning]
background = "$warning"
foreground = "$background"
padding = 6

[style.critical]
background = "$critical"
foreground = "$background"
padding = 6

# A pill inside a panel: its own rounded background, sitting on the group's. The
# workspaces use it to say which ones exist on another output.
[style.pill]
background = "$raised"
foreground = "$text"
padding = 10
radius = 12

[style.focused]
background = "$accent"
foreground = "$background"
padding = 10
radius = 12

[style.dim]
foreground = "$subtext"
padding = 10

# The pointer picks a module out without moving anything: hover is paint-only,
# so nothing resizes as the mouse crosses the bar.
[style.hovered]
background = "$raised"
foreground = "$text"

# ---------------------------------------------------------------------------
# Groups
#
# Every group is the same island: one rounded strip, both corners cut the same
# way. Uniformity is the point - a shape that differs should mean something
# differs, and here nothing does.
#
# Where an island holds one module it carries its own background and the module
# is bare. Where it holds several, the modules carry the background themselves,
# alternating between the two greys, and a `curve` is drawn where they meet: a
# sigmoid with horizontal tangents at both ends, so one shade turns into the
# next without a line anywhere. The group leaves its own background unset there,
# since the modules cover it end to end.
#
# `opacity` is what lets that sit on a wallpaper. An island is drawn opaque and
# faded once, as a finished thing, so everything inside it meets everything else
# at full strength: a filled separator lays its ground across the whole gap and
# its shape over the top, and two overlapping fills that were each already
# translucent would leave the shape heavier than the modules it runs between.
# Alpha written into a colour is applied once per fill; this is applied once per
# island, which is the level a person means by "see-through bar" anyway.
#
# `width` is how long the curve has to turn over. There is no `overlap`: that
# bleeds a separator a fraction under its neighbours to cover the seam two
# antialiased edges leave between them, and these edges are snapped to whole
# pixels, so there is no seam to cover.
# ---------------------------------------------------------------------------

[group.desktop]
modules = ["workspaces"]
background = "$surface"
radius = 12
# opacity = 0.8
padding = 3
spacing = 3

[group.desktop.edges]
left = "round"
right = "round"

[group.window]
modules = ["title"]
background = "$surface"
radius = 12
# opacity = 0.8

[group.window.edges]
left = "round"
right = "round"

# What is playing leads the right-hand run, and only appears when something is
# playing: a bar with nothing on it draws nothing. It sits here rather than in
# the centre so that folding it down to its icon does not leave the icon
# stranded in the middle of an empty bar.
[group.playing]
modules = ["media"]
background = "$surface"
radius = 12
# opacity = 0.8

[group.playing.edges]
left = "round"
right = "round"

# What the machine is doing with itself: how hard it is working, how much it is
# holding, and how hot that is making it. Three readings of one thing, so they
# share one island and run into each other rather than being ruled apart.
[group.system]
modules = ["cpu", "memory", "temperature"]
radius = 12
# opacity = 0.8

[group.system.separator]
shape = "curve"
width = 20
direction = "right"
color = "previous"

[group.system.edges]
left = "round"
right = "round"

# The keyboard's layout sits next to the network because both are about what the
# machine is connected to rather than what it is doing.
[group.network]
modules = ["language", "network"]
radius = 12
# opacity = 0.8

[group.network.separator]
shape = "curve"
width = 20
direction = "right"
color = "previous"

[group.network.edges]
left = "round"
right = "round"

[group.power]
modules = ["volume", "brightness", "battery"]
radius = 12
# opacity = 0.8

[group.power.separator]
shape = "curve"
width = 20
direction = "right"
color = "previous"

[group.power.edges]
left = "round"
right = "round"

# The clock is what the eye goes to, so it is the one thing that carries a
# colour of its own.
[group.time]
modules = ["clock"]
background = "$accent"
radius = 12
# opacity = 0.8

[group.time.edges]
left = "round"
right = "round"

# ---------------------------------------------------------------------------
# Modules
#
# Fixed widths where a number moves, so the bar does not shuffle sideways every
# time a percentage crosses ten. A left click swaps `format_alt` in and back.
#
# Inside the three shared islands the styles alternate, `tile`, `tile_alt`,
# `tile`, and an alarm style simply takes a module's turn: the curve on either
# side of it then runs from the ordinary grey into the alarm colour, which is
# what makes one hot reading read as part of the same strip rather than a badge
# stuck onto it.
# ---------------------------------------------------------------------------

# Three states, so a glance says which workspace is here, which is on the other
# screen and which is asking for attention. Everything else is a quiet number.
[module.workspaces]
source = "sway:workspaces"
style = "dim"
min_width = 34

[module.workspaces.states.focused]
focused = true
style = "focused"

[module.workspaces.states.visible]
visible = true
style = "pill"

[module.workspaces.states.urgent]
urgent = true
style = "critical"
radius = 12

# `controls = true` makes the module the remote as well as the display: a left
# click plays and pauses, and the wheel moves between tracks. dbar asks the
# player over the session bus and draws what the player then reports, so what is
# on the bar is what actually happened.
[module.media]
source = "media"
controls = true
collapsible = true
format = " {$artist  }$title "
style = "panel"
max_width = 320
# The icon is a button, so it shows what a click will do rather than what is
# already happening: while a track plays, clicking pauses it.
icon = "pause"

[module.media.states.paused]
field = "status"
equals = "paused"
foreground = "$subtext"
icon = "play"

[module.title]
source = "sway:window"
style = "panel"
max_width = 420

[module.cpu]
source = "cpu"
interval = "2s"
format = " $utilization.n(w:4) "
style = "tile"
icon = "cpu"

[module.cpu.states.busy]
above = 85
style = "warning"

[module.cpu.states.unreadable]
state = "error"
style = "critical"

# Click for what is actually in use rather than the share.
[module.memory]
source = "memory"
interval = "5s"
format = " $percent.n(w:4) "
format_alt = " $used.n(d:1) of $total.n(d:0){  swap $swap_percent} "
style = "tile_alt"
icon = "memory"

[module.memory.states.full]
above = 90
style = "warning"

# The processor's own sensor, found by driver name. A laptop sits in the
# fifties and sixties all day, so the collector's own rating decides when this
# is worth colouring rather than a number picked here.
[module.temperature]
source = "temperature"
interval = "5s"
format = " $temp.n(d:0) "
format_alt = " $temp.n(d:0) $label "
style = "tile"
icon = "temperature"

[module.temperature.states.warm]
state = "warning"
style = "warning"

[module.temperature.states.hot]
state = "critical"
style = "critical"

# The compositor says which layout is active, and says so again the moment it is
# switched, so this is never read on a timer. A click shows the full name.
[module.language]
source = "sway:language"
format = " $short "
format_alt = " $layout "
style = "tile"
icon = "keyboard"

# What to call each layout, keyed by xkb's own name for it. Optional: a layout
# with no line here is abbreviated instead, and "English (US)" would be "US".
# These are the layouts this bar was written on; swap in your own.
[module.language.layouts]
"English (US)" = "EN"
"Serbian (Latin)" = "SR"
"Serbian" = "RS"

# Follows whichever interface is actually up, so unplugging a cable moves it to
# the wireless card without a restart.
[module.network]
source = "network"
interval = "2s"
# The network's name when there is one, falling back to the interface: a cable
# has no name to give, and neither has a card that has joined nothing.
#
# `format_alt` is a list, so a left click goes round three views rather than
# toggling between two: what it is on, what it is doing, and how well it can
# hear it. The icon grades on the signal, so it says that much without a click.
format = " $ssid|$device "
format_alt = [" $down{  $up} ", " $signal.n(w:4){  $dbm.n(d:0) dBm} "]
style = "tile_alt"
icon = "wifi"

[module.network.states.offline]
field = "state"
equals = "down"
icon = "wifi-off"

# PipeWire says when the volume moves, so this is never sampled: it follows the
# default output, which is what the volume keys move, and follows it to a headset
# the moment one is plugged in.
[module.volume]
source = "audio"
# Scroll over it to change the volume, middle click to mute. dbar sets it itself
# rather than running a helper, and shows what PipeWire accepted rather than what
# was asked for.
scroll = "5%"
format = " $volume.n(w:4) "
format_alt = " $volume.n(w:4)  $device "
style = "tile"
icon = "volume"

# Muted is not a volume of zero - the level is still there, waiting - so the icon
# says so and the number goes quiet rather than changing.
#
# Rules are tried in name order and the first match wins, so this one sorts ahead
# of `port` below: a muted headset says muted, which is the more useful of the
# two things to know.
[module.volume.states.muted]
field = "muted"
equals = "yes"
foreground = "$subtext"
icon = "volume-muted"

# Which socket the sound is leaving by. PipeWire says so the moment a jack is
# plugged in, so the icon follows the headphones onto your head without a poll
# and without a helper.
[module.volume.states.port]
field = "port"
equals = "headphones"
icon = "headphones"

# The kernel reports a brightness change, so this is read when it moves and
# never in between - no interval, and nothing to press after a brightness key.
[module.brightness]
source = "backlight"
# Scrolling writes the controller's own file, which needs write access to it -
# on most systems that is membership of the `video` group. The number that then
# appears is the one the panel accepted, reported back by the kernel.
scroll = "5%"
format = " $brightness.n(w:4) "
style = "tile_alt"
icon = "brightness"

# Braces hold what should disappear rather than draw half a sentence: a machine
# on mains has no time remaining to report and does not mention one.
[module.battery]
source = "battery"
interval = "30s"
# The percentage is the whole of it at rest; a click asks for the detail, and
# another for how long the charge is expected to last. What is left is an
# estimate from the current draw, so it is worth a click rather than a place on
# the bar at all times.
format = " $percent.n(w:4) "
format_alt = [
  " $percent.n(w:4)  $status{  $power.n(d:1)}  health $health.n(d:0) ",
  " $percent.n(w:4){  $time.dur(style:short) left} ",
]
style = "tile"
icon = "battery"

# On the mains, not charging: a battery held at full, or at whatever cap a
# charge threshold sets, still reports `not charging`, and the icon should say
# the charger is in rather than that the battery is on its own.
[module.battery.states.plugged]
field = "supply"
equals = "mains"
icon = "battery-charging"

# The battery rates its own situation and only alarms while it is draining: the
# same 10% with the charger in is fine.
[module.battery.states.warning]
state = "warning"
style = "warning"

[module.battery.states.critical]
state = "critical"
style = "critical"

[module.clock]
source = "time"
# On the minute, rather than drifting from whenever dbar started.
interval = "1m"
format = " $now.time(f:'%a %d %b  %H:%M') "
style = "panel"
foreground = "$background"
icon = "clock"
